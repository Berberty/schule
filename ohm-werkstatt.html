:root{
  /* Layout: Kopfzeile mit Lichterkette als Fortschritt. Darunter die immer dunkle Werkbank (Bühne) neben bzw. über der hellen Aufgabenkarte. */
  --bg:#e9edf4; --grid:#dbe2ee; --paper:#ffffff; --ink:#121b33; --ink2:#525f7b; --line:#cfd7e6;
  --lamp:#ffc52e; --lamp-edge:#cf9500; --lamp-ink:#221900;
  --el:#1d57d6; --el-soft:#e4ecff;
  --ok:#147a4b; --ok-bg:#dff3e7; --no:#bd2f2f; --no-bg:#fbe5e3; --warn-bg:#fff1c7; --warn:#8a5a00;
  --bench:#0d1630; --bench2:#16213f; --bench3:#22305a; --bench-ink:#d4dcf0; --bench-ink2:#8f9cc0;
  --cu:#dc8f50; --cu-d:#6d3d1c; --e-fill:#a8e6ff; --e-edge:#0a2a70;
  --f-display:"Barlow Condensed","DIN Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","DIN Alternate","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080d1a; --grid:#0f1629; --paper:#131b30; --ink:#e7ecf8; --ink2:#9aa6c4; --line:#293455;
    --lamp:#ffc52e; --lamp-edge:#ffdb7a; --lamp-ink:#221900;
    --el:#7fb0ff; --el-soft:#1a2749;
    --ok:#4fd494; --ok-bg:#11301f; --no:#ff8a80; --no-bg:#3a1717; --warn-bg:#3a2d08; --warn:#ffd36a;
    --bench:#0d1630; --bench2:#16213f; --bench3:#22305a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080d1a; --grid:#0f1629; --paper:#131b30; --ink:#e7ecf8; --ink2:#9aa6c4; --line:#293455;
  --lamp:#ffc52e; --lamp-edge:#ffdb7a; --lamp-ink:#221900;
  --el:#7fb0ff; --el-soft:#1a2749;
  --ok:#4fd494; --ok-bg:#11301f; --no:#ff8a80; --no-bg:#3a1717; --warn-bg:#3a2d08; --warn:#ffd36a;
  --bench:#0d1630; --bench2:#16213f; --bench3:#22305a;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.45 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:1.5rem 1.5rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:0.1875rem solid var(--el);outline-offset:2px;border-radius:0.375rem}
h1,h2,h3,p{margin:0}
b,strong{font-weight:600}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:0.75rem;padding:0.5rem 1rem;background:var(--paper);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:0.5rem;border:0;background:none;padding:0.25rem 0.375rem 0.25rem 0;font:700 1.3125rem/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.logo svg{width:1.625rem;height:1.875rem;flex:none}
.logo .bulb-g{fill:var(--lamp);stroke:var(--ink);stroke-width:1.6}
.logo .bulb-b{fill:var(--ink)}
.chain{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.chain button{position:relative;border:0;background:none;padding:0.375rem 0;width:2.125rem;flex:0 1 2.125rem;min-width:1.25rem;display:flex;justify-content:center}
.chain button::before{content:"";position:absolute;left:-50%;right:50%;top:0.5625rem;height:2px;background:var(--ink2);opacity:.55}
.chain button:first-child::before{display:none}
.chain svg{position:relative;width:1.125rem;height:1.625rem;overflow:visible}
.chain .cb-g{fill:var(--paper);stroke:var(--ink2);stroke-width:1.5;transition:fill .4s}
.chain .cb-s{fill:var(--ink2)}
.chain .cb-h{fill:var(--lamp);opacity:0;transition:opacity .5s}
.chain button:disabled{cursor:default;opacity:.55}
.chain .is-done .cb-g{fill:var(--lamp);stroke:var(--lamp-edge)}
.chain .is-done .cb-h{opacity:calc(.12 + .28*var(--lvl,1))}
.chain .is-cur .cb-g{stroke:var(--el);stroke-width:2.6}
.chain .is-cur::after{content:"";position:absolute;bottom:0;left:50%;width:0.375rem;height:0.375rem;margin-left:-3px;border-radius:50%;background:var(--el)}
.readout{display:flex;flex-direction:column;align-items:flex-end;font:700 1.25rem/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.readout small{font:600 0.75rem/1.3 var(--f-display);letter-spacing:.06em;color:var(--ink2)}

main{max-width:71.25rem;margin:0 auto;padding:1.125rem 1rem 3.5rem}

/* ---------- Stationskopf ---------- */
.st-head{display:flex;align-items:center;gap:0.375rem 0.875rem;flex-wrap:wrap;margin-bottom:0.875rem}
.st-tt{display:flex;flex-direction:column;gap:0.1875rem;min-width:0}
.eyebrow{font:600 0.875rem/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.st-no{font:700 2.875rem/.85 var(--f-display);color:var(--el);font-variant-numeric:tabular-nums}
.st-head h1{font:700 1.875rem/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.roles{display:flex;flex-wrap:wrap;gap:0.375rem 0.5rem;margin-left:auto}
.role{display:inline-flex;gap:0.375rem;align-items:baseline;padding:0.1875rem 0.625rem;border-radius:6.1875rem;background:var(--el-soft);font-size:0.90625rem}
.role i{font:600 0.78125rem var(--f-display);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

/* ---------- Arbeitsbereich ---------- */
.work{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){
  .work{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);align-items:start}
  .work.no-scene{grid-template-columns:minmax(0,47.5rem)}
}
.scene{background:var(--bench);color:var(--bench-ink);border-radius:0.875rem;padding:0.5rem;border:1px solid var(--bench3);display:flex;flex-direction:column;gap:0.375rem;min-width:0}
.scene svg{display:block;width:100%;height:auto}
.scene .sc-row{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;justify-content:center;padding:2px 0.375rem 0.375rem}
.scene .sc-cap{font-size:0.84375rem;line-height:1.35;color:var(--bench-ink2);padding:0 0.5rem 0.375rem;text-align:center}
.scene .sc-split{height:1px;background:var(--bench3);margin:0 0.5rem}
.scene .sc-tag{font:600 0.8125rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--bench-ink2);padding:0.375rem 0.625rem 0}

.task{background:var(--paper);border:1px solid var(--line);border-radius:0.875rem;padding:1.125rem;display:flex;flex-direction:column;gap:0.875rem;min-width:0}
.task-meta{display:flex;justify-content:space-between;gap:0.625rem;font:600 0.875rem/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.q{font-size:1.1875rem;line-height:1.36;font-weight:600;text-wrap:pretty}
.how{font-size:0.90625rem;color:var(--ink2);line-height:1.4}
.ui{display:flex;flex-direction:column;gap:0.75rem}

.opts{display:grid;gap:0.5625rem}
.opts-img{grid-template-columns:repeat(auto-fit,minmax(9.375rem,1fr))}
.opt{display:flex;gap:0.75rem;align-items:flex-start;text-align:left;width:100%;padding:0.6875rem 0.8125rem;min-height:3.25rem;border:2px solid var(--line);border-radius:0.75rem;background:var(--paper);line-height:1.38;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--el)}
.opt-k{flex:none;width:1.75rem;height:1.75rem;display:grid;place-items:center;border-radius:0.4375rem;background:var(--el-soft);font:700 1.0625rem/1 var(--f-display)}
.opt-t{flex:1;min-width:0;padding-top:2px}
.opt.is-ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-no{border-color:var(--no);background:var(--no-bg)}
.opt.is-ok .opt-k{background:var(--ok);color:var(--paper)}
.opt.is-no .opt-k{background:var(--no);color:var(--paper)}
.opt:disabled{cursor:default}
.opt.is-dim{opacity:.5}
.opt.is-sel{border-color:var(--el);background:var(--el-soft)}
.opt svg{display:block;width:100%;height:auto;color:var(--ink)}
.opts-img .opt{flex-direction:column;gap:0.375rem}

.fb{display:flex;gap:0.625rem;padding:0.75rem 0.875rem;border-radius:0.75rem;border-left:0.375rem solid var(--el);background:var(--el-soft);line-height:1.42;font-size:1rem}
.fb[hidden]{display:none}
.fb .fb-i{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font:700 1rem/1 var(--f-display);background:var(--el);color:var(--paper);margin-top:1px}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)} .fb.ok .fb-i{background:var(--ok)}
.fb.no{border-color:var(--no);background:var(--no-bg)} .fb.no .fb-i{background:var(--no)}
.fb.warn{border-color:var(--lamp-edge);background:var(--warn-bg)} .fb.warn .fb-i{background:var(--lamp-edge);color:var(--lamp-ink)}
.fb .fb-p{display:block;font:700 0.875rem/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin-bottom:0.1875rem}
.fb.ok .fb-p{color:var(--ok)} .fb.no .fb-p{color:var(--no)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:0.625rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;min-height:3rem;padding:0.625rem 1.375rem;border-radius:0.75rem;border:2px solid var(--lamp-edge);background:var(--lamp);color:var(--lamp-ink);font:700 1.1875rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.btn:disabled{opacity:.38;cursor:default}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink)}
.btn.small{min-height:2.5rem;padding:0.375rem 0.875rem;font-size:1rem}
.btn.plain{background:none;border-color:transparent;color:var(--ink2);padding-left:0.375rem;padding-right:0.375rem}
.btn.onbench{background:var(--bench2);border-color:var(--bench3);color:var(--bench-ink)}
.btn.onbench[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}

.chips{display:flex;flex-wrap:wrap;gap:0.5rem}
.chip{min-height:2.625rem;padding:0.375rem 0.875rem;border-radius:0.625rem;border:2px solid var(--line);background:var(--paper);font-weight:600}
.chip[aria-pressed="true"],.chip.is-sel{border-color:var(--el);background:var(--el-soft)}
.chip:disabled{opacity:.45;cursor:default}
.chip.sym{font:700 1.375rem/1 var(--f-display);min-width:3.25rem}
.chip.is-ok{border-color:var(--ok);background:var(--ok-bg)}
.chip.is-no{border-color:var(--no);background:var(--no-bg)}

.rows{display:flex;flex-direction:column;gap:0.5625rem}
.row{border:2px solid var(--line);border-radius:0.75rem;padding:0.625rem 0.75rem;display:flex;flex-direction:column;gap:0.5rem}
.row-t{display:flex;gap:0.625rem;align-items:center;line-height:1.38}
.row-t svg{flex:none;width:2.125rem;height:2.125rem;color:var(--ink)}
.row .chips{gap:0.375rem}
.row .chip{min-height:2.375rem;padding:0.25rem 0.75rem;font-size:0.96875rem}
.row-fb{font-size:0.9375rem;color:var(--ink2);line-height:1.38}
.row.is-ok{border-color:var(--ok)} .row.is-no{border-color:var(--no)}
.mark{font:700 0.9375rem var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.mark.ok{color:var(--ok)} .mark.no{color:var(--no)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:0.5625rem 0.75rem}
.match .chip{width:100%;text-align:left;line-height:1.25;font-size:0.96875rem}
.match .chip.done{border-style:dashed;opacity:.9;cursor:default}
.match .chip.done b{font:700 0.875rem var(--f-display);margin-right:0.375rem;color:var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}60%{transform:translateX(0.3125rem)}100%{transform:none}}

.order-list{display:flex;flex-direction:column;gap:0.375rem;counter-reset:o}
.order-slot{display:flex;gap:0.625rem;align-items:center;min-height:2.625rem;padding:0.375rem 0.75rem;border-radius:0.625rem;border:2px dashed var(--line);color:var(--ink2)}
.order-slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.order-slot::before{counter-increment:o;content:counter(o);font:700 1.125rem var(--f-display);width:1.125rem}

.grid3{display:grid;grid-template-columns:minmax(6rem,1.3fr) 1fr 1fr;gap:0.375rem;align-items:stretch}
.grid3 .gh{font:600 0.8125rem/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:2px 0.25rem;align-self:end}
.grid3 .gr{display:flex;align-items:center;font-weight:600;padding:0 0.25rem}
.cell{min-height:3.125rem;border:2px dashed var(--line);border-radius:0.625rem;background:none;font:700 1.375rem/1 var(--f-display);display:grid;place-items:center}
.cell.filled{border-style:solid;border-color:var(--el);background:var(--el-soft)}
.cell.is-ok{border-color:var(--ok);background:var(--ok-bg)} .cell.is-no{border-color:var(--no);background:var(--no-bg)}
.cell small{font:500 0.75rem var(--f-body);color:var(--ink2);display:block;margin-top:2px}

.numrow{display:flex;flex-wrap:wrap;gap:0.625rem;align-items:center}
.numrow input{width:8rem;min-height:3rem;padding:0.375rem 0.75rem;border:2px solid var(--line);border-radius:0.625rem;background:var(--paper);font:700 1.5rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.numrow input:focus{border-color:var(--el);outline:none}
.numrow label{font:700 1.5rem var(--f-display)}

.calc{align-self:flex-start;background:var(--bench);color:var(--bench-ink);border-radius:0.75rem;padding:0.625rem 0.75rem;display:flex;flex-direction:column;gap:0.375rem;min-width:14.375rem}
.calc .cd{background:#c5d3b6;color:#14241a;border-radius:0.375rem;padding:0.375rem 0.625rem;text-align:right;font:600 1.4375rem/1.1 var(--f-mono);letter-spacing:.02em}
.calc small{font:600 0.78125rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--bench-ink2)}

.ctrl{display:flex;flex-direction:column;gap:0.375rem}
.ctrl label{display:flex;justify-content:space-between;font-weight:600}
.ctrl input[type=range]{width:100%;height:2.25rem;accent-color:var(--el)}
.mtab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:0.9375rem}
.mtab th,.mtab td{border:1px solid var(--line);padding:0.3125rem 0.25rem;text-align:center;min-width:2.125rem}
.mtab th{font:600 0.875rem var(--f-display);letter-spacing:.04em;background:var(--el-soft);text-align:left;padding-left:0.5rem;white-space:nowrap}
.tabwrap{overflow-x:auto}
.plotbox{border:1px solid var(--line);border-radius:0.625rem;padding:0.25rem;background:var(--paper)}
.plot{display:block;width:100%;height:auto;max-height:15rem;touch-action:manipulation}
.plot .ax{stroke:var(--ink);stroke-width:1.6;fill:none}
.plot .gr{stroke:var(--line);stroke-width:1}
.plot text{font:500 11px var(--f-body);fill:var(--ink2)}
.plot .axt{font:700 14px var(--f-display);fill:var(--ink)}
.plot .pt{fill:var(--el);stroke:var(--paper);stroke-width:1.5}
.plot .pt.lampp{fill:#d9822b}
.plot .miss{stroke:var(--no);stroke-width:2.4;stroke-linecap:round}
.plot .cv{fill:none;stroke:var(--el);stroke-width:2.6;stroke-linecap:round}
.plot .cv.lampc{stroke:#d9822b}
.plot .cv.ref{stroke:var(--ink2);stroke-width:1.6;stroke-dasharray:5 5}
.plot .lg{font:600 12px var(--f-body);fill:var(--ink)}
.plot.tap{cursor:crosshair}

.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.5rem}
.tray .chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0.5rem 0.25rem;font-size:0.90625rem;line-height:1.2;text-align:center}
.tray .chip svg{width:2.75rem;height:1.875rem;color:var(--ink)}
.tray .chip .mark{font-size:0.8125rem}
.tray .chip:disabled{opacity:1}
.chip small{display:block;font:500 0.75rem var(--f-body);color:var(--ink2)}

.checks{display:flex;flex-direction:column;gap:0.5rem}
.check{display:flex;gap:0.625rem;align-items:flex-start;padding:0.5625rem 0.75rem;border:2px solid var(--line);border-radius:0.75rem;line-height:1.38;color:var(--ink2)}
.check::before{content:"";flex:none;width:1.25rem;height:1.25rem;border-radius:50%;border:2px solid var(--ink2);margin-top:1px}
.check.on{border-color:var(--ok);color:var(--ink)}
.check.on::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 0.1875rem var(--paper)}

/* ---------- Startseite ---------- */
.start{display:grid;gap:1.125rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.start{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center}}
.start h1{font:700 clamp(2.5rem,6vw,4.75rem)/.86 var(--f-display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.start h1 span{color:var(--el)}
.start .lead{font-size:1.15625rem;max-width:34em;margin-top:0.75rem}
.start .facts{display:flex;flex-wrap:wrap;gap:0.375rem 1.125rem;margin-top:0.75rem;font:600 0.9375rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0.625rem}
.mode{display:flex;flex-direction:column;gap:0.1875rem;text-align:left;padding:0.75rem 0.875rem;border:2px solid var(--line);border-radius:0.75rem;background:var(--paper)}
.mode b{font:700 1.375rem/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.mode span{font-size:0.90625rem;color:var(--ink2);line-height:1.3}
.mode[aria-pressed="true"]{border-color:var(--el);background:var(--el-soft)}
.names{display:flex;flex-wrap:wrap;gap:0.5rem}
.names input{flex:1 1 8.125rem;min-width:0;min-height:2.875rem;padding:0.375rem 0.75rem;border:2px solid var(--line);border-radius:0.625rem;background:var(--paper)}
.names input:focus{border-color:var(--el);outline:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:0.875rem;padding:1.125rem;display:flex;flex-direction:column;gap:0.875rem}
.card h2{font:700 1.5rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.note{font-size:0.90625rem;color:var(--ink2);line-height:1.4}

/* ---------- Auswertung ---------- */
.sum{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.sum{grid-template-columns:minmax(0,21.25rem) minmax(0,1fr);align-items:start}}
.score{display:flex;flex-direction:column;align-items:center;gap:0.375rem;text-align:center}
.score svg{width:11.875rem;height:11.875rem}
.score .ring-bg{fill:none;stroke:var(--line);stroke-width:14}
.score .ring{fill:none;stroke:var(--lamp);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s}
.score .big{font:700 46px var(--f-display);fill:var(--ink)}
.score .of{font:600 15px var(--f-display);letter-spacing:.1em;fill:var(--ink2)}
.who{font-weight:600}
.srow{display:grid;grid-template-columns:2.125rem minmax(0,1fr) auto;gap:0.25rem 0.625rem;align-items:center;padding:0.5rem 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .n{font:700 1.75rem/1 var(--f-display);color:var(--el)}
.srow .t{font-weight:600;line-height:1.25}
.srow .t small{display:block;font-weight:400;color:var(--ink2);font-size:0.875rem}
.srow .p{font:700 1.1875rem var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:2 / 4;height:0.5rem;border-radius:6.1875rem;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6.1875rem;background:var(--ok)}
.bar.low i{background:var(--lamp-edge)}
.srow .again{grid-column:2 / 4;justify-self:start}

/* ---------- Übersicht / Dialog / Toast ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(6,10,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:4rem 1rem 1rem;overflow:auto}
.sheet[hidden]{display:none}
.sheet .card{width:min(35rem,100%)}
.sheet .srow{grid-template-columns:2.125rem minmax(0,1fr) auto}
.sheet .srow button.go{border:0;background:none;text-align:left;padding:0;font-weight:600}
.sheet .srow button.go:disabled{color:var(--ink2);cursor:default}
#toast{position:fixed;left:50%;bottom:1.125rem;transform:translate(-50%,1.875rem);z-index:50;max-width:calc(100% - 2rem);background:var(--ink);color:var(--paper);padding:0.625rem 1rem;border-radius:0.75rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- Bildschirmfüllend: Schriftgröße wird per Skript an die Fensterhöhe angepasst ---------- */
html.fit main{padding:.75rem 1rem 1rem}
html.fit .scene{max-height:var(--workH,none)}
html.fit .scene > svg,html.fit .scene > .sc-fit{flex:0 1 auto;min-height:0}
html.fit .scene > .sc-fit{display:flex;flex-direction:column;justify-content:center}
html.fit .scene > .sc-fit > svg{flex:0 1 auto;min-height:0;width:100%;height:auto}
html.fit .scene > .sc-row,html.fit .scene > .sc-cap,html.fit .scene > .sc-tag,html.fit .scene > .sc-split{flex:none}
.start .scene svg{max-height:36vh}
html.fit main{max-width:min(100%,1560px)}
html.fit .work{grid-template-columns:minmax(0,1fr) minmax(0,var(--taskfr,1.12fr))}
html.fit .work.no-scene{grid-template-columns:minmax(0,1fr)}
html.fit .opts{grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
html.fit .opts-img{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
html.fit .rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr))}
.meas{display:grid;gap:.75rem}
.meas-l{display:flex;flex-direction:column;gap:.75rem;min-width:0}
html.fit .meas{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}

/* ---------- Werkbank-Grafik ---------- */
.lab,.water,.lat,.scope{user-select:none;-webkit-user-select:none}
.lab{touch-action:pan-y}
.gBg .dots{opacity:.9}
.w-out{fill:none;stroke:var(--cu-d);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.w-in{fill:none;stroke:var(--cu);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.wire.user .w-out{stroke:#8a5326}
.wire.hot .w-in{stroke:#ff5a2e;animation:hot .32s infinite alternate}
.wire.hot .w-out{stroke:#ffb199}
@keyframes hot{to{stroke:#ffd0a6}}
.lab.opaque .wire .w-in,.lab.opaque .stub .w-in{stroke:#3d4c7c}
.lab.opaque .wire .w-out,.lab.opaque .stub .w-out{stroke:#27335a}
.lab.opaque .gE{visibility:hidden}
.w-hit{fill:none;stroke:transparent;stroke-width:24;pointer-events:stroke;cursor:pointer}
.sock-r{fill:#0a1126;stroke:#c7d1ea;stroke-width:3}
.sock-r.plus{stroke:#ff6b6b} .sock-r.minus{stroke:#5aa9ff} .sock-r.com{stroke:#7f8aa8}
.sock-r.dot{fill:var(--cu);stroke:var(--cu-d);stroke-width:2}
.hit{fill:transparent;stroke:none;touch-action:none}
.lab.edit .hit{cursor:pointer}
.lab.edit .sock-r{animation:sockp 1.6s infinite}
@keyframes sockp{50%{stroke-width:4.6}}
.rubber{fill:none;stroke:var(--lamp);stroke-width:5;stroke-dasharray:2 9;stroke-linecap:round;pointer-events:none}
.armed{fill:none;stroke:var(--lamp);stroke-width:3.5;pointer-events:none;animation:pulse .9s infinite}
@keyframes pulse{50%{opacity:.35}}
.e circle{fill:var(--e-fill);stroke:var(--e-edge);stroke-width:1}
.e path{fill:none;stroke:var(--e-edge);stroke-width:1.25;stroke-linecap:round}
.lbl{font:600 12px var(--f-body);fill:var(--bench-ink)}
.lbl2{font:500 11px var(--f-body);fill:var(--bench-ink2)}
.lbl-d{font:700 14px var(--f-display);letter-spacing:.05em;fill:var(--bench-ink)}
.pole{font:700 17px var(--f-display);fill:var(--bench-ink)}
.bat-body{fill:#273252;stroke:#40507f;stroke-width:1.5}
.bat-cap{fill:#f0a63a}
.bat-hot{fill:#ff3b1f;opacity:0;transition:opacity .4s;pointer-events:none}
.short .bat-hot{opacity:.55;animation:pulse .5s infinite}
.chan{fill:#efe4c9;stroke:#0003;stroke-width:1}
.chev{fill:none;stroke:#b3a784;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bat-v{font:700 13px var(--f-display);letter-spacing:.06em;fill:#e8edf8}
.sup-box{fill:#2a3555;stroke:#4a5a8c;stroke-width:1.5}
.knob{fill:#111a33;stroke:#8f9cc0;stroke-width:1.5}
.knob-l{stroke:var(--lamp);stroke-width:2.2;stroke-linecap:round}
.ac-box{fill:#3a2e58;stroke:#6753a0;stroke-width:1.5}
.ac-t{font:700 26px var(--f-display);fill:#e9defe}
.lamp-base{fill:#c9a44c;stroke:#6f5518;stroke-width:1.2}
.lamp-neck{fill:#9aa3b8;stroke:#4b5470;stroke-width:1}
.lamp-thr{stroke:#4b5470;stroke-width:1}
.glass{fill:rgba(255,236,170,.08);stroke:#b9c6e6;stroke-width:1.6}
.fil{fill:none;stroke:#8a7a66;stroke-width:2.6;stroke-linecap:round}
.glow{pointer-events:none;opacity:0}
.bulb{transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.bulb.out{transform:translate(0,-24px) rotate(-11deg)}
.bulb.twist .bulb-in{animation:twist .5s linear}
@keyframes twist{0%,50%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(.5)}}
.sw-base{fill:#1b2647;stroke:#3a4a7a;stroke-width:1.2}
.sw-dot{fill:#c7d1ea;stroke:#55617f;stroke-width:1}
.lever{transition:transform .25s}
.lever.open{transform:rotate(-34deg)}
.sw-knob{fill:#ff6b6b;stroke:#7a1f1f;stroke-width:1}
.brk .sw-knob{fill:#4fd494;stroke:#0e4b2d}
.brk.trip .sw-knob{fill:#ff6b6b;stroke:#7a1f1f}
.res-body{fill:#d8c59d;stroke:#7b6842;stroke-width:1.2}
.res-chan{fill:#efe4c9}
.res-ion{fill:#c98f5e}
.coil{fill:none;stroke:#b9c0cf;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.post{fill:#55617f;stroke:#2c3653}
.m-box{fill:#e6e9f2;stroke:#8792b0;stroke-width:1.5}
.m-chan{fill:#efe4c9;stroke:#0002}
.m-badge{fill:#121b33}
.m-badge-t{font:700 15px var(--f-display);fill:#fff;text-anchor:middle}
.lcd{fill:#c5d3b6;stroke:#6c7a60;stroke-width:1}
.seg{stroke:#15251a;stroke-linecap:round;fill:none}
.seg-dot{fill:#15251a}
.lcd-u{font:700 11px var(--f-display);fill:#15251a}
.clamp{fill:#8e99b5;stroke:#3a4466;stroke-width:1}
.gate-f{fill:none;stroke:var(--lamp);stroke-width:2.6}
.gate-b{fill:#0a1126;stroke:var(--lamp);stroke-width:1.4}
.gate-t{font:700 14px var(--f-display);letter-spacing:.04em;fill:#fff}
.gate.tick .gate-f{stroke:#fff}
.arrow-g{cursor:pointer}
.arrow-g .a-l{stroke-width:5;stroke-linecap:round;fill:none}
.arrow-g .a-h{stroke:none}
.arrow-g.blue .a-l{stroke:#5aa9ff} .arrow-g.blue .a-h{fill:#5aa9ff}
.arrow-g.red .a-l{stroke:#ff6b6b} .arrow-g.red .a-h{fill:#ff6b6b}
.arrow-g .a-bg{fill:#16213f;stroke:#31406f;stroke-width:1.2}
.arrow-g.unset .a-l{stroke-dasharray:3 7}
.deco{fill:none;stroke:#8f9cc0;stroke-width:1.6}
.deco-f{fill:#1b2647;stroke:#4a5a8c;stroke-width:1.5}
.metal{fill:#2a3555;stroke:#aab4cf;stroke-width:4;stroke-linejoin:round}
.heat{fill:none;stroke:#7b5a3a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.heat.on{stroke:#ff8a3d}
.spark{fill:#ffe45c;stroke:#ff7a1a;stroke-width:1.2;opacity:0}
.spark.on{opacity:1;animation:pulse .25s infinite}
.fig{fill:none;stroke:#d4dcf0;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fig-h{fill:#d4dcf0}
.earth{stroke:#7f8aa8;stroke-width:2;stroke-linecap:round;fill:none}
.wire.thin .w-out{stroke-width:7;stroke:#3b4770} .wire.thin .w-in{stroke-width:4;stroke:#7f8aa8}
/* Wasserkreislauf */
.pipe-o{fill:none;stroke:#7d9cc4;stroke-width:17;stroke-linejoin:round}

/* Zahlenwert mit Einheit */

/* Tabelle füllen: Karte antippen, dann Feld antippen */

/* ===== Weitere Aufgabenformen der Übungsblätter: Tabelle ergänzen, Lückentext, im Diagramm eintragen ===== */
function parseNum(s) { s = String(s).trim().replace(/\s/g, '').replace(',', '.'); return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN; }
function numOk(v, a, tol) { return Math.abs(v - a) <= (tol == null ? 0.011 : tol) * Math.abs(a) + 1e-9; }
function fmtNum(a) { return de(a, Math.abs(a - Math.round(a)) < 1e-9 ? 0 : Math.abs(a * 10 - Math.round(a * 10)) < 1e-9 ? 1 : 2); }
/* Mehrere Felder: Anteil richtiger Felder beim ersten Prüfen; ist beim zweiten Prüfen alles richtig, mindestens die halbe Punktzahl */
function scoreFirst(max, first, n, tries, all) { return n === 1 ? scoreTries(max, tries) : Math.max(Math.floor(max * first / n + 1e-9), all && tries === 2 ? Math.floor(max / 2) : 0); }

/* Eingabefeld für eine Zahl */
function numIn(c, ins, label) {
  const i = el('input', { class: 'tin', type: 'text', inputmode: 'decimal', autocomplete: 'off', 'aria-label': label || 'Wert', size: c.w || 4 });
  ins.push({ i, c }); return i;
}

/* Werte in Tabelle, Liste, Karten oder Kette eintragen */

    el('div', { class: 'tc-a' }, el('span', { html: x.pre }), numIn(x, ins, 'Karte ' + x.k), el('span', { class: 'tl-u', text: x.unit }))))));
  if (o.chain) box.append(el('div', { class: 'tchain' }, o.chain.map(row => el('div', { class: 'ch-row' }, row.map(x => {
    if (x.op != null) return el('span', { class: 'ch-op' }, el('i', { html: x.op }), svgEl('<svg viewBox="0 0 60 14" aria-hidden="true"><path d="M2 7H52M46 2l7 5-7 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'));
    if ('a' in x) return el('span', { class: 'ch-box in' }, numIn(x, ins, 'Feld'), el('span', { class: 'tl-u', text: x.unit }));
    return el('span', { class: 'ch-box', html: x.t });
  })))));
  if (o.tail) box.append(el('div', { class: 'tlist' }, o.tail.map(x => el('div', { class: 'tl' }, el('span', { class: 'tl-pre', html: x.pre }), numIn(x, ins, x.pre.replace(/<[^>]+>/g, '')), x.unit ? el('span', { class: 'tl-u', text: x.unit }) : null))));
  const n = ins.length, maxTries = n === 1 ? 2 : 3;

/* Lückentext mit Wortkasten: Wort antippen, es füllt die markierte oder die nächste freie Lücke */

  let sel = null, tries = 0, first = null, over = false;
  const lines = o.lines.map(line => {

      if (k > 0) {
        const g = { want: o.ans[gaps.length], val: null, b: el('button', { class: 'gap', type: 'button', 'aria-label': 'Lücke ' + (gaps.length + 1) }) };
        g.b.addEventListener('click', () => { if (over || g.done) return; if (g.val != null) { put(g, null); sel = g; } else sel = sel === g ? null : g; refresh(); });
        gaps.push(g);
        const m = /^[.,;:!?)]+/.exec(part);   // Satzzeichen bleibt an der Lücke
        if (m) { p.append(el('span', { class: 'nw' }, g.b, m[0])); part = part.slice(m[0].length); } else p.append(g.b);
      }
      if (part) p.append(el('span', { html: part }));
    });
    return p;
  });
  if (o.num) wrap.append(el('ol', {}, lines)); else wrap.append(...lines);
  const bank = el('div', { class: 'bank', role: 'group', 'aria-label': 'Wortkasten' });
  (o.keep ? o.bank : shuffle(o.bank)).forEach(w => {
    const b = el('button', { class: 'chip word', type: 'button', html: w });
    b.addEventListener('click', () => {
      if (over) return;
      const g = (sel && !sel.done) ? sel : gaps.find(x => x.val == null);
      if (!g) { ctx.note('info', T('Alle Lücken sind gefüllt. {Tippe|Tippt} eine Lücke an, um sie zu leeren.')); return; }
      put(g, w); sel = gaps.find(x => x.val == null) || null; refresh();
    });
    chips.push({ w, b }); bank.append(b);
  });

    else if (tries >= 3) {

    } else {
      ctx.note('no', T(`${right} von ${n} Lücken stimmen. Die falschen Wörter kommen in den Wortkasten zurück.`) + (tries === 1 && n === 1 ? ' ' + SECOND : ''));
      ctx.later(() => { gaps.forEach((g, k) => { if (!ok[k] && !over) put(g, null); }); sel = gaps.find(x => x.val == null) || null; refresh(); }, 900);
    }

/* Im Diagramm der Werkbank eintragen: Messpunkte setzen oder Ursprungsgeraden zeichnen */
Task.place = o => ctx => {
  const ch = ctx.scene.chart || ctx.scene;

  tick(dt) {
    for (const L of this.L) {
      L.off = (L.off + this.o.k * this.I(L) * dt) % L.sp;
      L.els.forEach((e, k) => { const [x, y] = at(L.sm, (L.off + k * L.sp) % L.sm.L); e.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`); });

  teardown(); S.view = 'start'; MODE = 'team'; renderTop();
  const main = $('#main'); main.innerHTML = ''; main.style.removeProperty('--acc'); window.scrollTo(0, 0);
  cur = { timers: [], objs: [] };

  const begin = i => {
    const list = [...names.querySelectorAll('input')].map((x, k) => x.value.trim() || 'Person ' + 'AB'[k]);
    const free = S.free; S = fresh(); S.names = list; S.free = free; S.date = new Date().toISOString();

  };

    const sc = stScore(i);
    const b = el('button', { class: 'sheet-b', type: 'button', style: `--acc:${c.acc};--acc2:${c.acc2}` },
      el('span', { class: 'sb-n', text: String(i + 1) }), el('span', { class: 'sb-t' }, el('b', { text: c.title }), el('small', { text: `${c.sub} · ${c.steps.length} Aufgaben` + (sc.n ? ` · ${sc.p} von ${sc.m} Punkten` : '') })));
    b.addEventListener('click', () => { if (TEACHER) { S = fresh(); S.date = new Date().toISOString(); showStep(i, 0); } else if (going) gotoStation(i); else begin(i); });
    return b;
  };
  const sheets = el('div', { class: 'sheets' }, COURSE.map(sheetBtn));
  const right = el('div', { style: 'display:flex;flex-direction:column;gap:16px' });
  if (TEACHER) {
    right.append(el('div', { class: 'card' }, el('h2', { text: 'Lehrkraft-Ansicht' }),
      el('p', { html: 'Alle Folien sind frei, <b>Weiter</b> geht ohne Lösen. <b>Lösung zeigen</b> führt die Aufgabe richtig gelöst vor, mit Rückmeldung und Erklärung. Blättern mit den Pfeiltasten ← und →.' }),
      el('p', { class: 'note', text: 'Direkt zu einem Blatt:' }), sheets));
  } else {
    const card = el('div', { class: 'card' }, el('h2', { text: going ? 'Weiterarbeiten' : 'Zu zweit an einem Gerät' }));
    if (going) {
      const cont = el('button', { class: 'btn', type: 'button', text: 'Weitermachen' });
      cont.addEventListener('click', () => { if (S.viewWas === 'sum') showSum(); else showStep(S.st, S.sp); });
      card.append(el('p', { text: `${S.names.join(' und ')}: bisher ${t.p} von ${t.m} Punkten, zuletzt bei Blatt ${S.st + 1}.` }), el('div', {}, cont), el('p', { class: 'note', text: 'Oder direkt zu einem Blatt:' }), sheets);
    } else {
      card.append(el('p', { text: 'Eine Person tippt, die andere begründet die Antwort. Bei jedem Blatt wird getauscht.' }), names,
        el('p', { class: 'note', text: 'Jedes Blatt lässt sich für sich bearbeiten. Mit welchem fangt ihr an?' }), sheets);
    }
    card.append(el('p', { class: 'note', text: 'Wertung: volle Punktzahl beim ersten Versuch, die halbe beim zweiten. Ein Hinweis kostet 1 Punkt.' }));
    right.append(card);
  }
  const left = el('div', { style: 'display:flex;flex-direction:column;gap:16px' },
    el('div', {}, el('div', { class: 'eyebrow', text: 'Physik 8 · Wiederholung' }), el('h1', { html: 'Ohm-<span>Werkstatt</span>' }),
      el('p', { class: 'lead', text: 'Die Grundaufgaben der Übungsblätter 1 bis 4: Stromstärke, Spannung, Widerstand und Kennlinien. Zu jeder Antwort gibt es sofort eine Rückmeldung.' }),
      el('div', { class: 'facts' }, el('span', { text: `${COURSE.length} Übungsblätter` }), el('span', { text: 'rund 45 Minuten' }), el('span', { text: `${t.m} Punkte` }))), hero);
  main.append(el('div', { class: 'start' }, left, right));
  const ch = new Chart(hero, { imax: 4, umax: 8, gi: 0.5, gu: 1, li: 1, lu: 2, label: 'Drei Kennlinien mit 8, 4 und 2 Ohm' });

  ohmiSays(hero, 'Hallo, ich bin <b>Ohmi</b>! Je steiler meine Kennlinie, desto stärker bremse ich den Strom.');

const TICK = new Set();
let S = null, cur = null, lastT = 0;
const BULB = '<svg viewBox="0 0 18 26" aria-hidden="true"><circle class="cb-h" cx="9" cy="9" r="13"/><path class="cb-g" d="M9 1.5a7.5 7.5 0 0 0-4.6 13.4c.8.7 1.3 1.5 1.3 2.6h6.6c0-1.1.5-1.9 1.3-2.6A7.5 7.5 0 0 0 9 1.5Z"/><rect class="cb-s" x="5.7" y="18.6" width="6.6" height="5.2" rx="1.4"/></svg>';

function fresh() { return { v: 1, mode: 'team', names: TEACHER ? ['Person A', 'Person B'] : [], secs: 0, st: 0, sp: 0, view: 'start', res: {}, open: 9, free: TEACHER, runs: {}, date: null }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ohne Speicher geht es auch */ } }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === 1 && s.res) return s; } catch (e) { /* kein Speicher */ } return null; }
function clock(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function stScore(si) { let p = 0, m = 0, n = 0; for (const s of COURSE[si].steps) { m += s.pts; const r = S.res[s.id]; if (r) { p += r.p; n++; } } return { p, m, n, all: n === COURSE[si].steps.length }; }
function total() { let p = 0, m = 0; COURSE.forEach((c, i) => { const s = stScore(i); p += s.p; m += s.m; }); return { p, m }; }
function started() { return Object.keys(S.res).length > 0 || S.st > 0 || S.sp > 0; }

function frame(ts) {
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts;
  for (const o of TICK) { try { o.tick(dt); } catch (e) { console.error(e); TICK.delete(o); } }
  requestAnimationFrame(frame);
}
function teardown() {
  if (!cur) return;
  cur.timers.forEach(clearTimeout);
  for (const o of cur.objs) { TICK.delete(o); if (o.destroy) o.destroy(); }
  cur = null;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 3200); }

function renderTop() {
  const chain = $('#chain'); chain.innerHTML = '';
  COURSE.forEach((c, i) => {
    const sc = stScore(i), open = (TEACHER || S.view !== 'start') && (S.free || i <= S.open);
    const b = el('button', { type: 'button', class: (sc.all ? 'is-done ' : '') + (S.view === 'step' && S.st === i ? 'is-cur' : ''), title: c.title, 'aria-label': `Blatt ${i + 1}: ${c.title}` + (sc.all && sc.m ? `, ${sc.p} von ${sc.m} Punkten` : ''), html: BULB });
    b.disabled = !open;
    b.style.setProperty('--lvl', sc.m ? (sc.p / sc.m).toFixed(2) : '1');
    b.addEventListener('click', () => gotoStation(i));
    chain.append(b);
  });
  $('#pts').textContent = total().p; $('#time').textContent = clock(S.secs);
}
function gotoStation(i) { const k = TEACHER ? 0 : COURSE[i].steps.findIndex(s => !S.res[s.id]); showStep(i, k < 0 ? 0 : k); }
function rolesEl(si) {
  if (S.names.length < 2) return null;
  const n = S.names, r = [['Tippt', n[si % 2]], ['Begründet', n[(si + 1) % 2]]];
  return el('div', { class: 'roles' }, r.map(([a, b]) => el('span', { class: 'role' }, el('i', { text: a }), el('span', { text: b }))));
}

/* ---------- Eine Aufgabe anzeigen ---------- */
function showStep(si, pi) {
  teardown();
  const st = COURSE[si], step = st.steps[pi];
  if (TEACHER) { delete S.res[step.id]; window.__lastO = null; }
  S.view = 'step'; S.viewWas = 'step'; S.st = si; S.sp = pi; if (si > S.open) S.open = si; save();
  MODE = 'team';
  cur = { timers: [], objs: [] };
  const main = $('#main'); main.innerHTML = ''; window.scrollTo(0, 0);
  const sceneEl = el('div', { class: 'scene' }), ui = el('div', { class: 'ui' });
  const fb = el('div', { class: 'fb', role: 'status', 'aria-live': 'polite' }, el('span', { class: 'fb-i' }), el('div', { class: 'fb-b' })); fb.hidden = true;
  const hintHost = el('div', { class: 'ui' });
  const next = el('button', { class: 'btn', type: 'button', id: 'next', text: pi + 1 < st.steps.length ? 'Weiter' : si + 1 < COURSE.length ? 'Nächstes Blatt' : 'Zur Auswertung' });
  const back = el('button', { class: 'btn plain small', type: 'button', text: 'Zurück' });
  const solveB = TEACHER ? el('button', { class: 'btn small ghost', type: 'button', text: 'Lösung zeigen' }) : null;
  const locked = !!S.res[step.id];
  next.disabled = !(locked || S.free);
  const setFb = (kind, html) => { fb.hidden = false; fb.className = 'fb ' + kind; fb.firstChild.textContent = kind === 'ok' ? '✓' : kind === 'no' ? '✗' : kind === 'warn' ? '!' : 'i'; fb.lastChild.innerHTML = html; };
  let capEl = null, hintBtn = null;
  const ctx = {
    step, max: step.pts, sceneEl, ui, locked, over: false, penalty: 0, scene: null,
    add(o) { cur.objs.push(o); TICK.add(o); return o; },
    drop(o) { TICK.delete(o); const i = cur.objs.indexOf(o); if (i >= 0) cur.objs.splice(i, 1); if (o.destroy) o.destroy(); },
    later(fn, ms) { const mine = cur, id = setTimeout(() => { if (cur === mine) fn(); }, ms); cur.timers.push(id); return id; },
    cap(html) { if (!capEl) capEl = el('div', { class: 'sc-cap' }); sceneEl.append(capEl); capEl.innerHTML = html; },
    note(kind, html) { if (!ctx.over) setFb(kind, html); },
    clearNote() { if (!ctx.over) fb.hidden = true; },
    hint(html) {
      const box = el('div', { class: 'fb warn' }, el('span', { class: 'fb-i', text: 'i' }), el('div', { html })); box.hidden = true;
      hintBtn = el('button', { class: 'btn plain small', type: 'button', text: locked ? 'Hinweis anzeigen' : 'Hinweis anzeigen (kostet 1 Punkt)', style: 'align-self:flex-start' });
      hintBtn.addEventListener('click', () => { if (!locked) ctx.penalty = 1; box.hidden = false; hintBtn.remove(); hintBtn = null; });
      hintHost.append(hintBtn, box);
    },
    finish(p, html, kind = 'ok', lead = '') {
      if (ctx.over) return;
      p = clamp(Math.round(p - ctx.penalty), 0, ctx.max);
      let rec = S.res[step.id];
      if (!rec) { rec = S.res[step.id] = { p, m: step.pts }; save(); }
      const k = kind === 'part' ? (p > 0 ? 'ok' : 'no') : kind;
      const label = !step.pts ? 'Ohne Wertung' : locked ? `Bereits gewertet: ${rec.p} von ${rec.m} Punkten` : `${p} von ${step.pts} Punkten` + (ctx.penalty ? ', 1 Punkt für den Hinweis abgezogen' : '');
      setFb(k, `<span class="fb-p">${label}</span>${lead}${html}`);
      ctx.over = true; next.disabled = false; if (hintBtn) hintBtn.remove(); if (solveB) { solveB.disabled = true; solveB.textContent = 'Gelöst'; }
      renderTop();
    }
  };
  const task = el('div', { class: 'task' },
    el('div', { class: 'task-meta' }, el('span', { text: `${step.ref || 'Aufgabe'} · ${pi + 1} von ${st.steps.length}` }), el('span', { text: !step.pts ? 'ohne Wertung' : locked ? `gewertet: ${S.res[step.id].p} von ${step.pts}` : `${step.pts} Punkte` })),
    el('p', { class: 'q', html: T(step.q) }), step.how ? el('p', { class: 'how', html: T(step.how) }) : null, ui, hintHost, fb, el('div', { class: 'nav' }, back, solveB, next));
  main.append(
    el('section', { class: 'st-head' },
      el('span', { class: 'st-no', text: String(si + 1).padStart(2, '0') }),
      el('div', { class: 'st-tt' },
        el('div', { class: 'eyebrow', text: `${st.sub} · etwa ${st.min} Minuten` + ((S.runs[si] || 1) > 1 ? ` · ${S.runs[si]}. Durchgang` : '') }),
        el('h1', { text: st.title })), rolesEl(si)),
    el('div', { class: 'work' + (step.scene ? '' : ' no-scene') }, step.scene ? sceneEl : null, task));
  main.style.setProperty('--acc', st.acc || 'var(--el)'); main.style.setProperty('--acc2', st.acc2 || 'var(--el-soft)');
  back.addEventListener('click', () => { if (pi > 0) showStep(si, pi - 1); else if (si > 0) showStep(si - 1, COURSE[si - 1].steps.length - 1); else { S.viewWas = 'step'; showStart(); } });
  next.addEventListener('click', () => {
    if (pi + 1 < st.steps.length) return showStep(si, pi + 1);
    const sc = stScore(si);
    if (sc.all) toast(`Blatt ${si + 1} abgeschlossen` + (sc.m ? `: ${sc.p} von ${sc.m} Punkten` : ''));
    if (si + 1 < COURSE.length) showStep(si + 1, 0); else showSum();
  });
  if (step.scene) ctx.scene = step.scene(ctx);
  step.ui(ctx);
  if (solveB) solveB.addEventListener('click', () => { solveB.disabled = true; solveB.textContent = 'Wird gelöst …'; teacherSolve(ctx).catch(e => console.error(e)); });
  renderTop();
  fit();
}

/* ---------- Auswertung ---------- */
function resetStation(si) { for (const s of COURSE[si].steps) delete S.res[s.id]; S.runs[si] = (S.runs[si] || 1) + 1; save(); showStep(si, 0); }
function stationRows(withAgain) {
  return COURSE.map((c, i) => {
    const sc = stScore(i), ratio = sc.m ? sc.p / sc.m : 1, low = sc.all && sc.m > 0 && ratio < 0.7;
    const row = el('div', { class: 'srow' }, el('span', { class: 'n', text: String(i + 1) }),
      el('span', { class: 't' }, c.title, el('small', { text: c.sub + ((S.runs[i] || 1) > 1 ? ` · ${S.runs[i]}. Durchgang` : '') })),
      el('span', { class: 'p', text: !sc.m ? (sc.all ? 'angesehen' : 'offen') : sc.n === 0 ? 'offen' : `${sc.p} / ${sc.m}` + (sc.all ? '' : ' …') }));
    if (sc.m) row.append(el('div', { class: 'bar' + (low ? ' low' : '') }, el('i', { style: `width:${Math.round(ratio * 100 * (sc.n ? 1 : 0))}%` })));
    if (withAgain && low) { const b = el('button', { class: 'btn plain small again', type: 'button', text: 'Blatt noch einmal bearbeiten' }); b.addEventListener('click', () => resetStation(i)); row.append(b); }
    return row;
  });
}
function showSum() {
  teardown(); S.view = 'sum'; S.viewWas = 'sum'; save(); renderTop();
  const main = $('#main'); main.innerHTML = ''; window.scrollTo(0, 0);
  const t = total(), pct = t.m ? t.p / t.m : 0, C = 2 * Math.PI * 80;
  const open = COURSE.some((c, i) => !stScore(i).all && c.steps.some(s => s.pts));
  const lows = COURSE.map((c, i) => ({ c, s: stScore(i) })).filter(x => x.s.all && x.s.m && x.s.p / x.s.m < 0.7);
  const verdict = open ? 'Noch sind nicht alle Blätter bearbeitet.' : pct >= 0.85 ? 'Das sitzt: Stromstärke, Spannung, Widerstand und Kennlinien sind verstanden.' : lows.length ? 'Eine solide Grundlage. Bei den gelb markierten Stationen lohnt sich ein zweiter Durchgang.' : 'Eine solide Grundlage.';
  const ring = sv('svg', { viewBox: '0 0 190 190', role: 'img', 'aria-label': `${t.p} von ${t.m} Punkten` },
    sv('circle', { class: 'ring-bg', cx: 95, cy: 95, r: 80 }),
    sv('circle', { class: 'ring', cx: 95, cy: 95, r: 80, 'stroke-dasharray': C.toFixed(1), 'stroke-dashoffset': (C * (1 - pct)).toFixed(1), transform: 'rotate(-90 95 95)' }),
    sv('text', { class: 'big', x: 95, y: 104, 'text-anchor': 'middle', text: String(t.p) }), sv('text', { class: 'of', x: 95, y: 128, 'text-anchor': 'middle', text: `VON ${t.m} PUNKTEN` }));
  const who = S.names.length ? S.names.join(' und ') : 'Team';
  const d = S.date ? new Date(S.date) : new Date();
  const again = el('button', { class: 'btn ghost small', type: 'button', text: 'Zurück zu den Blättern' }); again.addEventListener('click', () => gotoStation(0));
  main.append(
    el('section', { class: 'st-head' }, el('div', { class: 'st-tt' }, el('div', { class: 'eyebrow', text: 'Ohm-Werkstatt · Physik 8' }), el('h1', { text: 'Auswertung' }))),
    el('div', { class: 'sum' },
      el('div', { class: 'card score' }, ring, el('p', { class: 'who', text: who }),
        el('p', { class: 'note', text: `${d.toLocaleDateString('de-DE')} · Arbeitszeit ${clock(S.secs)} min · ${Math.round(pct * 100)} %` }), el('p', { text: verdict })),
      el('div', { class: 'card' }, el('h2', { text: 'Übungsblätter' }), el('div', {}, stationRows(true)), el('div', { class: 'nav' }, again))));
  fit();
}

/* ---------- Anpassung an die Fensterhöhe: alles sichtbar ohne Scrollen ---------- */
const FIT = { f: 0, raf: 0 };
function fit() {
  const root = document.documentElement, main = $('#main');
  if (innerWidth < 700 || innerHeight < 420) { root.classList.remove('fit'); root.style.fontSize = ''; main.style.removeProperty('--workH'); FIT.f = 0; return; }
  root.classList.add('fit');
  const fits = f => {
    root.style.fontSize = f.toFixed(2) + 'px';
    const avail = innerHeight - $('.top').offsetHeight, cs = getComputedStyle(main), head = main.querySelector('.st-head');
    const hh = head ? head.offsetHeight + parseFloat(getComputedStyle(head).marginBottom) : 0;
    main.style.setProperty('--workH', Math.max(150, avail - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - hh) + 'px');
    return root.scrollHeight <= innerHeight;
  };
  // größte Schrift zwischen 10 px und der Grundgröße, bei der die ganze Seite ins Fenster passt
  const base = clamp(innerWidth / 80, 14, 20), work = main.querySelector('.work:not(.no-scene)');
  const best = () => { let hi = base, lo = 10; if (fits(hi)) return hi; for (let i = 0; i < 9; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; } return lo; };
  if (work) work.style.removeProperty('--taskfr');
  let f = best();
  if (work && f < base) {
    // reicht der Platz nicht, darf die Aufgabe breiter werden und die Werkbank schmaler
    let pick = null;
    for (const r of ['1.5fr', '2fr']) { work.style.setProperty('--taskfr', r); const g = best(); if (g > f + 0.4) { f = g; pick = r; } }
    if (pick) work.style.setProperty('--taskfr', pick); else work.style.removeProperty('--taskfr');
  }
  fits(f); FIT.f = f;
}
function refit() { if (FIT.raf) return; FIT.raf = requestAnimationFrame(() => { FIT.raf = 0; fit(); }); }

/* ---------- Übersicht ---------- */
function openSheet() {
  const sh = $('#sheet'); sh.innerHTML = ''; sh.hidden = false;
  const close = () => { sh.hidden = true; sh.innerHTML = ''; };
  const rows = stationRows(false);
  rows.forEach((row, i) => {
    const can = S.view !== 'start' && (S.free || i <= S.open), t = row.querySelector('.t');
    const b = el('button', { class: 'go', type: 'button' }); b.disabled = !can; while (t.firstChild) b.append(t.firstChild); t.append(b);
    b.addEventListener('click', () => { close(); gotoStation(i); });
  });
  const sum = el('button', { class: 'btn small', type: 'button', text: 'Auswertung ansehen' }); sum.disabled = !started();
  sum.addEventListener('click', () => { close(); showSum(); });
  const fin = el('button', { class: 'btn plain small', type: 'button', text: 'Schließen' }); fin.addEventListener('click', close);
  const reset = el('button', { class: 'btn plain small', type: 'button', text: 'Neu beginnen' }); let armed = false;
  reset.addEventListener('click', () => { if (!armed) { armed = true; reset.textContent = 'Wirklich alles löschen?'; return; } const free = S.free; S = fresh(); S.free = free; save(); close(); showStart(); });
  sh.append(el('div', { class: 'card', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Übersicht der Stationen' }, el('h2', { text: 'Übersicht' }), el('div', {}, rows), el('div', { class: 'nav' }, sum, el('span', {}, reset, fin))));
  sh.onclick = e => { if (e.target === sh) close(); };
  fin.focus();
}

/* ---------- Start ---------- */
function start(data) {
  S = (data && data.S && data.S.v === 1 ? data.S : null) || load() || fresh();
  if (!S.runs) S.runs = {};
  S.viewWas = S.view;
  $('#logo').addEventListener('click', openSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; } });
  if (TEACHER) document.addEventListener('keydown', e => {
    if (S.view !== 'step' || !$('#sheet').hidden || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
    if (e.key === 'ArrowRight') { const n = $('#next'); if (n && !n.disabled) { e.preventDefault(); n.click(); } }
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (S.sp > 0) showStep(S.st, S.sp - 1); else if (S.st > 0) showStep(S.st - 1, COURSE[S.st - 1].steps.length - 1); }
  });
  let taps = [];
  $('#readout').addEventListener('click', () => {
    const now = Date.now(); taps = taps.filter(t => now - t < 2500); taps.push(now);
    if (taps.length >= 5) { taps = []; S.free = !S.free; save(); toast(S.free ? 'Lehrkraft-Modus: Alle Folien sind frei.' : 'Lehrkraft-Modus beendet.'); if (S.view === 'step') showStep(S.st, S.sp); else renderTop(); }
  });
  setInterval(() => { if (S.view === 'step' && !document.hidden) { S.secs++; $('#time').textContent = clock(S.secs); if (S.secs % 10 === 0) save(); } }, 1000);
  requestAnimationFrame(frame);
  if (window.ResizeObserver) new ResizeObserver(refit).observe($('#main'));
  addEventListener('resize', () => fit());
  if (data && data.S && S.view === 'step') showStep(S.st, S.sp); else if (data && data.S && S.view === 'sum') showSum(); else showStart();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S })); } catch (e) { /* nur im Viewer vorhanden */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
