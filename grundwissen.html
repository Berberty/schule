:root{
  /* Layout: Kopfzeile mit Bausteinkette als Fortschritt. Darunter die dunkle Tafel (Abbildung) neben bzw. über der hellen Aufgabenkarte. */
  --bg:#e9edf4; --grid:#dbe2ee; --paper:#ffffff; --ink:#121b33; --ink2:#525f7b; --line:#cfd7e6;
  --gold:#ffc52e; --gold-edge:#cf9500; --gold-ink:#221900;
  --el:#1d57d6; --el-soft:#e4ecff;
  --ok:#147a4b; --ok-bg:#dff3e7; --no:#bd2f2f; --no-bg:#fbe5e3; --warn-bg:#fff1c7; --warn:#8a5a00;
  --merk:#f4f7fd; --merk-edge:#9fb3dd;
  --bench:#0d1630; --bench2:#16213f; --bench3:#22305a; --bench-ink:#d4dcf0; --bench-ink2:#8f9cc0;
  --f-display:"Barlow Condensed","DIN Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","DIN Alternate","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080d1a; --grid:#0f1629; --paper:#131b30; --ink:#e7ecf8; --ink2:#9aa6c4; --line:#293455;
    --gold:#ffc52e; --gold-edge:#ffdb7a; --gold-ink:#221900;
    --el:#7fb0ff; --el-soft:#1a2749;
    --ok:#4fd494; --ok-bg:#11301f; --no:#ff8a80; --no-bg:#3a1717; --warn-bg:#3a2d08; --warn:#ffd36a;
    --merk:#18223d; --merk-edge:#3b4c7f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080d1a; --grid:#0f1629; --paper:#131b30; --ink:#e7ecf8; --ink2:#9aa6c4; --line:#293455;
  --gold:#ffc52e; --gold-edge:#ffdb7a; --gold-ink:#221900;
  --el:#7fb0ff; --el-soft:#1a2749;
  --ok:#4fd494; --ok-bg:#11301f; --no:#ff8a80; --no-bg:#3a1717; --warn-bg:#3a2d08; --warn:#ffd36a;
  --merk:#18223d; --merk-edge:#3b4c7f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--el);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
b,strong{font-weight:600}
sub,sup{font-size:.72em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.18;margin:0 .12em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .18em}
.fr>span:last-child{padding:0 .18em}
.nw{white-space:nowrap}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 6px 4px 0;font:700 21px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.logo svg{width:28px;height:28px;flex:none}
.logo .k1{fill:var(--gold);stroke:var(--ink);stroke-width:1.6}
.logo .k2{fill:none;stroke:var(--ink);stroke-width:1.6}
.chain{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;gap:4px}
.chain button{border:0;background:none;padding:6px 0;width:30px;flex:0 1 30px;min-width:16px;display:flex;justify-content:center}
.chain svg{width:24px;height:18px;overflow:visible}
.chain .stone{fill:var(--paper);stroke:var(--ink2);stroke-width:1.5;transition:fill .4s}
.chain .is-done .stone{fill:var(--gold);stroke:var(--gold-edge)}
.chain .is-part .stone{fill:var(--warn-bg);stroke:var(--gold-edge)}
.chain .is-cur .stone{stroke:var(--el);stroke-width:2.8}
.chain button:disabled{cursor:default;opacity:.5}
.lvl-tag{font:700 15px/1 var(--f-display);letter-spacing:.08em;color:var(--el);white-space:nowrap;text-transform:uppercase}
.readout{display:flex;flex-direction:column;align-items:flex-end;font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;border:0;background:none;padding:0}
.readout small{font:600 12px/1.3 var(--f-display);letter-spacing:.06em;color:var(--ink2)}

main{max-width:1140px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Stationskopf ---------- */
.st-head{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.eyebrow{font:600 14px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.st-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.st-no{font:700 54px/.82 var(--f-display);color:var(--el);font-variant-numeric:tabular-nums}
.st-head h1{font:700 34px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.st-sub{color:var(--ink2);font-size:16.5px;font-style:italic}
.roles{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.role{display:inline-flex;gap:6px;align-items:baseline;padding:3px 10px;border-radius:99px;background:var(--el-soft);font-size:14.5px}
.role i{font:600 12.5px var(--f-display);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

/* ---------- Arbeitsbereich ---------- */
.work{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){
  .work{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
  .work.no-scene{grid-template-columns:minmax(0,780px)}
  .scene{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
}
.scene{background:var(--bench);color:var(--bench-ink);border-radius:14px;padding:8px;border:1px solid var(--bench3);display:flex;flex-direction:column;gap:6px;min-width:0}
.scene svg{display:block;width:100%;height:auto}
.sc-cap{font-size:13.5px;line-height:1.35;color:var(--bench-ink2);padding:0 8px 6px;text-align:center}
.task{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.task-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:600 14px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.task-meta .gwref{color:var(--el)}
.q{font-size:19px;line-height:1.4;font-weight:600;text-wrap:pretty}
.how{font-size:14.5px;color:var(--ink2);line-height:1.4}
.ui{display:flex;flex-direction:column;gap:12px;min-width:0}

.opts{display:grid;gap:9px}
.opts-img{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--paper);line-height:1.4;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--el)}
.opt-k{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:var(--el-soft);font:700 17px/1 var(--f-display)}
.opt-t{flex:1;min-width:0;padding-top:2px}
.opt.is-ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-no{border-color:var(--no);background:var(--no-bg)}
.opt.is-ok .opt-k{background:var(--ok);color:var(--paper)}
.opt.is-no .opt-k{background:var(--no);color:var(--paper)}
.opt:disabled{cursor:default}
.opt.is-dim{opacity:.5}
.opt.is-sel{border-color:var(--el);background:var(--el-soft)}
.opts-img .opt{flex-direction:column;gap:6px}
.opt .pic{display:block;width:100%;border-radius:8px;background:var(--bench);padding:4px}
.opt .pic svg{display:block;width:100%;height:auto}

.fb{display:flex;gap:10px;padding:12px 14px;border-radius:12px;border-left:6px solid var(--el);background:var(--el-soft);line-height:1.45;font-size:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:12px;border:2px solid var(--gold-edge);background:var(--gold);color:var(--gold-ink);font:700 19px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}

.btn:not(:disabled):active{transform:translateY(1px)}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink)}
.btn.small{min-height:40px;padding:6px 14px;font-size:16px}
.btn.plain{background:none;border-color:transparent;color:var(--ink2);padding-left:6px;padding-right:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-weight:600;line-height:1.3}
.chip[aria-pressed="true"],.chip.is-sel{border-color:var(--el);background:var(--el-soft)}
.chip:disabled{opacity:.45;cursor:default}
.chip.sym{font:700 21px/1 var(--f-display);min-width:52px}
.chip.is-ok{border-color:var(--ok);background:var(--ok-bg);opacity:1}
.chip.is-no{border-color:var(--no);background:var(--no-bg);opacity:1}

.rows{display:flex;flex-direction:column;gap:9px}

.mark{font:700 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.mark.ok{color:var(--ok)} .mark.no{color:var(--no)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.match .chip{width:100%;text-align:left;line-height:1.3;font-size:15.5px;font-weight:500}

@keyframes shake{20%{transform:translateX(-5px)}60%{transform:translateX(5px)}100%{transform:none}}

.order-list{display:flex;flex-direction:column;gap:6px;counter-reset:o}

.cloze{font-size:18px;line-height:2.25;text-wrap:pretty}

.slot{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:38px;padding:2px 10px;margin:0 2px;vertical-align:middle;border:2px dashed var(--ink2);border-radius:9px;background:var(--paper);font:600 17px/1.2 var(--f-body);color:var(--ink)}

.pass{display:flex;flex-direction:column}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(6,10,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 64px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}

/* ===== Aufgabentypen ===== */

/* Eine richtige Antwort */
Task.mc = o => ctx => {
  const order = o.keep ? o.opts.map((_, i) => i) : shuffle(o.opts.map((_, i) => i));
  const img = o.opts.some(x => x.pic);
  const box = el('div', { class: 'opts' + (img ? ' opts-img' : '') }), btns = [], maxTries = o.opts.length <= 2 ? 1 : 2;
  let tries = 0, over = false;
  const end = () => btns.forEach(x => { x.b.disabled = true; if (!x.b.classList.contains('is-ok') && !x.b.classList.contains('is-no')) x.b.classList.add('is-dim'); });
  order.forEach((oi, k) => {
    const op = o.opts[oi], tt = el('span', { class: 'opt-t', html: T(op.t || '') });

    const b = el('button', { class: 'opt', type: 'button' }, el('span', { class: 'opt-k', text: 'ABCDEF'[k] }), tt);
    b.addEventListener('click', () => {

        else ctx.note('no', why + SECOND);

};

/* Mehrere richtige Antworten ankreuzen */

/* Jede Zeile einer Kategorie zuordnen */

/* Paare bilden */
Task.match = o => ctx => {

  if (o.heads) grid.append(el('div', { class: 'gh', text: o.heads[0] }), el('div', { class: 'gh', text: o.heads[1] }));
  const press = (arr, i) => arr.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
  const tryPair = () => {
    if (selL == null || selR == null) return;
    const l = selL, r = selR, lbn = lb[l], rbn = rb[r]; selL = selR = null; press(lb, -1); press(rb, -1);
    if (R[r] === l) {
      done++;
      [lbn, rbn].forEach(b => { b.disabled = true; b.classList.add('done', 'is-ok'); b.prepend(el('b', { text: String(done) })); });
      ctx.clearNote();
      if (done === n) { over = true; show.remove(); ctx.finish(Math.max(0, ctx.max - errors), T(o.ok), errors ? 'part' : 'ok', errors ? `<b>${errors} ${errors === 1 ? 'Fehlversuch' : 'Fehlversuche'}.</b> ` : ''); }
    } else {
      errors++;
      [lbn, rbn].forEach(b => { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400); });
      if (errors >= REVEAL_AT) show.hidden = false;
      ctx.note('no', T(o.no || 'Diese beiden gehören nicht zusammen.') + (errors >= REVEAL_AT ? REVEAL_NOW : ''));
    }

  const show = revealBtn(() => {
    if (over) return; over = true;
    const found = done; let k = done;
    for (let l = 0; l < n; l++) if (!lb[l].disabled) { k++; [lb[l], rb[R.indexOf(l)]].forEach(b => { b.disabled = true; b.classList.add('done', 'shown'); b.prepend(el('b', { text: String(k) })); }); }
    press(lb, -1); press(rb, -1); show.remove();
    ctx.finish(Math.max(0, Math.floor(ctx.max * found / n + 1e-9) - errors), T(o.ok), 'part', `<b>${found} von ${n} Paaren gefunden, ${errors} Fehlversuche. Die übrigen Paare sind eingeblendet.</b> `);

    l.addEventListener('click', () => { selL = selL === k ? null : k; press(lb, selL == null ? -1 : selL); tryPair(); });
    r.addEventListener('click', () => { selR = selR === k ? null : k; press(rb, selR == null ? -1 : selR); tryPair(); });
    lb.push(l); rb.push(r); grid.append(l, r);

};

/* Reihenfolge herstellen */

  shuffle(o.items.map((t, i) => ({ t, i }))).forEach(it => {
    const b = el('button', { class: 'chip', type: 'button', html: T(it.t) });
    b.addEventListener('click', () => {
      if (it.i === next) {

      } else { errors++; b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400); if (errors >= REVEAL_AT) show.hidden = false; ctx.note('no', T(o.no || 'Dieser Schritt kommt erst später.') + (errors >= REVEAL_AT ? REVEAL_NOW : '')); }
    });

    pool.remove(); show.remove();
    ctx.finish(0, T(o.ok), 'part', `<b>${found} von ${o.items.length} Karten gesetzt, ${errors} Fehlversuche. Die übrigen sind eingeblendet.</b> `);

/* Zahlenwert mit Einheit */
function parseNum(s) {
  let raw = String(s).trim().replace(/\s/g, '').replace(/−/g, '-').replace(/[·⋅*x×]10\^?/i, 'e').replace(/^10\^(-?\d+)$/, '1e$1');

}

function parseNums(s) {
  const v = parseNum(s), out = isNaN(v) ? [] : [v], raw = String(s).trim().replace(/\s/g, '');

Task.num = o => ctx => {

  const chips = el('div', { class: 'chips', role: 'group', 'aria-label': 'Einheit' });
  (o.units || []).forEach(u => { const b = el('button', { class: 'chip sym', type: 'button', html: u, 'aria-pressed': 'false' }); b.addEventListener('click', () => { if (over) return; unit = u; [...chips.children].forEach(c => c.setAttribute('aria-pressed', String(c === b))); }); chips.append(b); });
  const check = el('button', { class: 'btn small ghost', type: 'button', text: 'Prüfen' });
  const lock = () => { inp.disabled = true; check.disabled = true; [...chips.children].forEach(c => c.disabled = true); };

    tries++;

    }

/* Lücken füllen: Karte antippen, dann Lücke antippen (Lückentext, Formel, Beschriftung) */
Task.slots = o => ctx => {
  const host = el('div', { class: o.fig ? 'figwrap' : 'cloze' + (o.formula ? ' formula' : '') });
  const cells = [];
  let html = T(o.html).replace(/\[\[(\d+)\]\]/g, (m, i) => `<button type="button" class="slot" data-i="${i}" aria-label="Lücke ${+i + 1}">&nbsp;</button>`);
  host.innerHTML = html;
  host.querySelectorAll('.slot').forEach(b => { const i = +b.dataset.i; cells[i] = { b, want: [].concat(o.want[i]), val: null }; });
  const pool = el('div', { class: 'chips' }), chips = new Map();
  let sel = null, first = null, over = false;
  host.__cells = cells;
  const place = (cell, val) => { cell.val = val; cell.b.innerHTML = val == null ? '&nbsp;' : chips.get(val).h; cell.b.classList.toggle('filled', val != null); cell.b.classList.remove('is-no', 'is-ok'); };
  const refresh = () => {
    for (const [v, c] of chips) { c.b.disabled = over || (!o.reuse && cells.some(x => x.val === v)); c.b.setAttribute('aria-pressed', String(sel === v)); }
    check.disabled = over || cells.some(x => x.val == null);
  };
  cells.forEach(cell => cell.b.addEventListener('click', () => { if (over) return; if (sel != null) { place(cell, sel); sel = null; } else if (cell.val != null) place(cell, null); refresh(); }));
  (o.keep ? o.chips : shuffle(o.chips)).forEach(c => {
    const b = el('button', { class: 'chip' + (o.sym ? ' sym' : ''), type: 'button', 'aria-pressed': 'false', html: c.h });
    b.addEventListener('click', () => { sel = sel === c.v ? null : c.v; refresh(); });
    chips.set(c.v, { b, h: c.h }); pool.append(b);
  });
  /* Welche Lücken stimmen bei dieser Belegung? */

    const bad = vals.map(() => false);

    (o.pairs || []).forEach(([f1, u1, f2, u2]) => { const pos = v => [].concat(o.want[f1]).indexOf(v); [[f1, u1], [f2, u2]].forEach(([f, u]) => { const k = pos(vals[f]); if (k >= 0 && vals[u] !== [].concat(o.want[u1])[k]) bad[u] = true; }); });

      out[i] = null; return false;

  };

      ctx.finish(Math.floor(ctx.max * first / cells.length + 1e-9), T(o.ok), first === cells.length ? 'ok' : 'part', first === cells.length ? '' : `<b>Beim ersten Prüfen: ${first} von ${cells.length} richtig.</b> `);
    } else {
      cells.forEach((x, i) => { if (!ok[i]) { x.b.classList.add('is-no'); setTimeout(() => { if (!over && x.val === vals[i] && x.b.classList.contains('is-no')) place(x, null); refresh(); }, 900); } else x.b.classList.add('is-ok'); });
      show.hidden = false;
      ctx.note('no', T((o.no ? o.no + ' ' : '') + `${right} von ${cells.length} Lücken stimmen. Die übrigen Karten kommen zurück. Weiter probieren oder die Lösung zeigen lassen: Beides ist möglich.`));
    }

    refresh(); show.remove();
    ctx.finish(Math.floor(ctx.max * first / cells.length + 1e-9), T(o.ok), 'part', `<b>Beim ersten Prüfen: ${first} von ${cells.length} richtig. Die Lösung ist eingeblendet.</b> `);
  });
  ctx.ui.append(el('p', { class: 'how', text: T(o.how || '{Tippe|Tippt} eine Karte an und dann die passende Lücke.') }), host, pool, el('div', { class: 'acts' }, check, show));
};

    ctx.finish(0, T(o.ok), 'part', `<b>${found} von ${left.length} Messpunkten eingetragen, ${errors} Fehlversuche. Die übrigen sind eingeblendet.</b> `);
  });

    if (over) return;
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    let x = (q.x - A.L) / A.w * o.x.max, y = (A.H - A.B - q.y) / A.h * o.y.max;

    const txt = `${o.x.sym} = ${de(x, o.x.rd || 0)}${NB}${o.x.unit}, ${o.y.sym} = ${de(y, o.y.rd || 0)}${NB}${o.y.unit}`;

      hit.done = true; gp.append(svgN('circle', { class: 'pt', cx: A.X(hit.p[0]), cy: A.Y(hit.p[1]), r: 5.5 }));
      read.innerHTML = `Getroffen: ${txt}.`;

      if (errors >= REVEAL_AT) show.hidden = false;
      read.innerHTML = `Getippt: ${txt}. Dort liegt kein Messpunkt.` + (errors >= REVEAL_AT ? REVEAL_NOW : '');
    }
  });
  ctx.ui.append(el('div', { class: 'plotbox' }, svg), read, show);
};

/* ===== Bildschirmfüllend: Inhalt so skalieren, dass er ohne Scrollen ganz sichtbar ist (ab 900 px Breite) ===== */
const FIT = { min: 0.5 };
function fitBox(outer, inner) {
  if (!outer || !inner || !outer.isConnected) return;
  inner.style.transform = ''; inner.style.width = ''; outer.style.height = '';
  if (window.innerWidth < 900) { outer.classList.remove('fitted'); return; }
  outer.classList.add('fitted');
  const mainEl = outer.parentElement, pb = mainEl ? parseFloat(getComputedStyle(mainEl).paddingBottom) || 0 : 0;
  const W = outer.clientWidth, avail = window.innerHeight - outer.getBoundingClientRect().top - pb - 4;
  const ok = z => { inner.style.width = (W / z) + 'px'; return inner.scrollHeight * z <= avail; };
  let z = 1;
  if (!ok(1)) { let lo = FIT.min, hi = 1; for (let i = 0; i < 7; i++) { const m = (lo + hi) / 2; if (ok(m)) lo = m; else hi = m; } z = lo; ok(z); }
  inner.style.width = (W / z) + 'px';
  inner.style.transform = z < 1 ? `scale(${z})` : '';
  outer.style.height = Math.ceil(inner.scrollHeight * z) + 'px';
}
function autoFit(outer, inner) {
  let raf = 0;
  const run = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => fitBox(outer, inner)); };
  const mo = new MutationObserver(run);
  mo.observe(inner, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['hidden', 'class'] });
  run();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
  return { run, stop: () => mo.disconnect() };
}

const LV = () => LEVELS[S.lvl];
function stScore(li, si) { let p = 0, m = 0, n = 0; const st = LEVELS[li].stations[si]; for (const s of st.steps) { m += s.pts; const r = S.res[s.id]; if (r) { p += r.p; n++; } } return { p, m, n, all: n === st.steps.length }; }

function gwLabel(li, ref) { const L = LEVELS[li]; return typeof ref === 'string' && ref[0] === 'M' ? `Mathe ${L.n}.${ref.slice(1)}` : `GW ${L.n}.${ref}`; }

  for (const st of LEVELS[li].stations) for (const s of st.steps) if ((s.gw || []).includes(ref)) { all++; const r = S.res[s.id]; if (r) { done++; p += r.p; m += r.m; } }

    hintBtn = el('button', { class: 'btn plain small', type: 'button', text: locked ? 'Hinweis anzeigen' : 'Hinweis anzeigen (kostet 1 Punkt)', style: 'align-self:flex-start' });

    el('div', { class: 'task-meta' }, el('span', { text: `Aufgabe ${pi + 1} von ${st.steps.length}` }), el('span', { class: 'gwref', text: gwTxt }), el('span', { text: locked ? `gewertet: ${S.res[step.id].p} von ${step.pts}` : `${step.pts} ${step.pts === 1 ? 'Punkt' : 'Punkte'}` })),

      el('div', { class: 'st-title' }, el('span', { class: 'st-no', text: String(si + 1).padStart(2, '0') }), el('h1', { text: st.title })),

/* ---------- Auswertung einer Jahrgangsstufe ---------- */
function resetStation(si) { for (const s of LV().stations[si].steps) delete S.res[s.id]; const k = S.lvl + '.' + si; S.runs[k] = (S.runs[k] || 1) + 1; save(); showStep(si, 0); }

      el('div', { class: 'bar' + (low ? ' low' : '') }, el('i', { style: `width:${Math.round(ratio * 100)}%` })));
    if (withAgain && low) { const b = el('button', { class: 'btn plain small again', type: 'button', text: 'Station noch einmal bearbeiten' }); b.addEventListener('click', () => resetStation(i)); row.append(b); }

}
function passEl(li) {

    });

function showSum() {

/* ---------- Urkunde ---------- */
const CERT_MIN = 0.5;   /* Mindestanteil der Punkte für eine Urkunde */

    return { p, m, n, k, st, sicher, refs, what: 'der Jahrgangsstufen 7 bis 10', date: LEVELS.map((L, i) => S.done[i]).filter(Boolean).pop(), arch: ARCH(LEVELS.map(() => 1), true) };
  }
  const L = LEVELS[li], s = lvScore(li), rs = [...L.gw.map((x, j) => j + 1), ...L.math.map((x, j) => 'M' + (j + 1))];

}

  const fact = (b, t) => el('div', {}, el('b', { text: b }), el('span', { text: t }));
  main.append(
    el('div', { class: 'cert-tools no-print' }, inputs, el('div', { class: 'nav' }, back, canPrint ? print : el('span', { class: 'note', text: 'Drucken ist in dieser Vorschau gesperrt; auf der veröffentlichten Seite erscheint hier der Druckknopf.' }))),
    el('div', { class: 'cert', role: 'img', 'aria-label': 'Urkunde' }, el('div', { class: 'cert-in' },

      el('p', { class: 'cert-t', html: `${S.mode === 'team' && S.names.filter(Boolean).length > 1 ? 'haben' : 'hat'} das Grundwissen Physik ${d.what}<br><b>${grade}</b>.` }),
      el('div', { class: 'cert-facts' }, fact(String(d.k), `Aufgaben in ${d.st} Stationen`), fact(`${d.p} von ${d.m}`, `Punkten · ${Math.round(pct * 100)} %`), fact(`${d.sicher} von ${d.refs}`, 'Einträgen sicher')),
      el('div', { class: 'cert-foot' }, el('div', {}, el('span', { text: d.date || new Date().toLocaleDateString('de-DE') }), el('i', { text: 'Datum' })), el('div', {}, el('span', { html: '&nbsp;' }), el('i', { text: 'Lehrkraft' }))))));

/* ---------- Übersicht ---------- */

  const reset = el('button', { class: 'btn plain small', type: 'button', text: 'Alles neu beginnen' }); let armed = false;

}

/* ---------- Start ---------- */

try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S })); } catch (e) { /* nur im Viewer vorhanden */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
