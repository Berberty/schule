:root{
  /* Layout: Kopfzeile mit Lichterkette als Fortschritt. Darunter die immer dunkle Werkbank (Bühne) neben bzw. über der hellen Aufgabenkarte. */
  --bg:#e9edf4; --grid:#dbe2ee; --paper:#ffffff; --ink:#121b33; --ink2:#525f7b; --line:#cfd7e6;
  --lamp:#ffc52e; --lamp-edge:#cf9500; --lamp-ink:#221900;
  --el:#1d57d6; --el-soft:#e4ecff;
  --ok:#147a4b; --ok-bg:#dff3e7; --no:#bd2f2f; --no-bg:#fbe5e3; --warn-bg:#fff1c7; --warn:#8a5a00;
  --bench:#0d1630; --bench2:#16213f; --bench3:#22305a; --bench-ink:#d4dcf0; --bench-ink2:#8f9cc0;
  --cu:#dc8f50; --cu-d:#6d3d1c; --e-fill:#a8e6ff; --e-edge:#0a2a70;
  --f-display:"Barlow Condensed","DIN Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","DIN Alternate","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080d1a; --grid:#0f1629; --paper:#131b30; --ink:#e7ecf8; --ink2:#9aa6c4; --line:#293455;
    --lamp:#ffc52e; --lamp-edge:#ffdb7a; --lamp-ink:#221900;
    --el:#7fb0ff; --el-soft:#1a2749;
    --ok:#4fd494; --ok-bg:#11301f; --no:#ff8a80; --no-bg:#3a1717; --warn-bg:#3a2d08; --warn:#ffd36a;
    --bench:#0d1630; --bench2:#16213f; --bench3:#22305a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080d1a; --grid:#0f1629; --paper:#131b30; --ink:#e7ecf8; --ink2:#9aa6c4; --line:#293455;
  --lamp:#ffc52e; --lamp-edge:#ffdb7a; --lamp-ink:#221900;
  --el:#7fb0ff; --el-soft:#1a2749;
  --ok:#4fd494; --ok-bg:#11301f; --no:#ff8a80; --no-bg:#3a1717; --warn-bg:#3a2d08; --warn:#ffd36a;
  --bench:#0d1630; --bench2:#16213f; --bench3:#22305a;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.45 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:1.5rem 1.5rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:0.1875rem solid var(--el);outline-offset:2px;border-radius:0.375rem}
h1,h2,h3,p{margin:0}
b,strong{font-weight:600}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:0.75rem;padding:0.5rem 1rem;background:var(--paper);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:0.5rem;border:0;background:none;padding:0.25rem 0.375rem 0.25rem 0;font:700 1.3125rem/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.logo svg{width:1.625rem;height:1.875rem;flex:none}
.logo .bulb-g{fill:var(--lamp);stroke:var(--ink);stroke-width:1.6}
.logo .bulb-b{fill:var(--ink)}
.chain{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.chain button{position:relative;border:0;background:none;padding:0.375rem 0;width:2.125rem;flex:0 1 2.125rem;min-width:1.25rem;display:flex;justify-content:center}
.chain button::before{content:"";position:absolute;left:-50%;right:50%;top:0.5625rem;height:2px;background:var(--ink2);opacity:.55}
.chain button:first-child::before{display:none}
.chain svg{position:relative;width:1.125rem;height:1.625rem;overflow:visible}
.chain .cb-g{fill:var(--paper);stroke:var(--ink2);stroke-width:1.5;transition:fill .4s}
.chain .cb-s{fill:var(--ink2)}
.chain .cb-h{fill:var(--lamp);opacity:0;transition:opacity .5s}
.chain button:disabled{cursor:default;opacity:.55}
.chain .is-done .cb-g{fill:var(--lamp);stroke:var(--lamp-edge)}
.chain .is-done .cb-h{opacity:calc(.12 + .28*var(--lvl,1))}
.chain .is-cur .cb-g{stroke:var(--el);stroke-width:2.6}
.chain .is-cur::after{content:"";position:absolute;bottom:0;left:50%;width:0.375rem;height:0.375rem;margin-left:-3px;border-radius:50%;background:var(--el)}
.readout{display:flex;flex-direction:column;align-items:flex-end;font:700 1.25rem/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.readout small{font:600 0.75rem/1.3 var(--f-display);letter-spacing:.06em;color:var(--ink2)}

main{max-width:71.25rem;margin:0 auto;padding:1.125rem 1rem 3.5rem}

/* ---------- Stationskopf ---------- */
.st-head{display:flex;align-items:center;gap:0.375rem 0.875rem;flex-wrap:wrap;margin-bottom:0.875rem}
.st-tt{display:flex;flex-direction:column;gap:0.1875rem;min-width:0}
.eyebrow{font:600 0.875rem/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.st-no{font:700 2.875rem/.85 var(--f-display);color:var(--el);font-variant-numeric:tabular-nums}
.st-head h1{font:700 1.875rem/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.roles{display:flex;flex-wrap:wrap;gap:0.375rem 0.5rem;margin-left:auto}
.role{display:inline-flex;gap:0.375rem;align-items:baseline;padding:0.1875rem 0.625rem;border-radius:6.1875rem;background:var(--el-soft);font-size:0.90625rem}
.role i{font:600 0.78125rem var(--f-display);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

/* ---------- Arbeitsbereich ---------- */
.work{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){
  .work{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);align-items:start}
  .work.no-scene{grid-template-columns:minmax(0,47.5rem)}
}
.scene{background:var(--bench);color:var(--bench-ink);border-radius:0.875rem;padding:0.5rem;border:1px solid var(--bench3);display:flex;flex-direction:column;gap:0.375rem;min-width:0}
.scene svg{display:block;width:100%;height:auto}
.scene .sc-row{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;justify-content:center;padding:2px 0.375rem 0.375rem}
.scene .sc-cap{font-size:0.84375rem;line-height:1.35;color:var(--bench-ink2);padding:0 0.5rem 0.375rem;text-align:center}
.scene .sc-split{height:1px;background:var(--bench3);margin:0 0.5rem}
.scene .sc-tag{font:600 0.8125rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--bench-ink2);padding:0.375rem 0.625rem 0}

.task{background:var(--paper);border:1px solid var(--line);border-radius:0.875rem;padding:1.125rem;display:flex;flex-direction:column;gap:0.875rem;min-width:0}
.task-meta{display:flex;justify-content:space-between;gap:0.625rem;font:600 0.875rem/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.q{font-size:1.1875rem;line-height:1.36;font-weight:600;text-wrap:pretty}
.how{font-size:0.90625rem;color:var(--ink2);line-height:1.4}
.ui{display:flex;flex-direction:column;gap:0.75rem}

.opts{display:grid;gap:0.5625rem}
.opts-img{grid-template-columns:repeat(auto-fit,minmax(9.375rem,1fr))}
.opt{display:flex;gap:0.75rem;align-items:flex-start;text-align:left;width:100%;padding:0.6875rem 0.8125rem;min-height:3.25rem;border:2px solid var(--line);border-radius:0.75rem;background:var(--paper);line-height:1.38;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--el)}
.opt-k{flex:none;width:1.75rem;height:1.75rem;display:grid;place-items:center;border-radius:0.4375rem;background:var(--el-soft);font:700 1.0625rem/1 var(--f-display)}
.opt-t{flex:1;min-width:0;padding-top:2px}
.opt.is-ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-no{border-color:var(--no);background:var(--no-bg)}
.opt.is-ok .opt-k{background:var(--ok);color:var(--paper)}
.opt.is-no .opt-k{background:var(--no);color:var(--paper)}
.opt:disabled{cursor:default}
.opt.is-dim{opacity:.5}
.opt.is-sel{border-color:var(--el);background:var(--el-soft)}
.opt svg{display:block;width:100%;height:auto;color:var(--ink)}
.opts-img .opt{flex-direction:column;gap:0.375rem}

.fb{display:flex;gap:0.625rem;padding:0.75rem 0.875rem;border-radius:0.75rem;border-left:0.375rem solid var(--el);background:var(--el-soft);line-height:1.42;font-size:1rem}
.fb[hidden]{display:none}
.fb .fb-i{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font:700 1rem/1 var(--f-display);background:var(--el);color:var(--paper);margin-top:1px}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)} .fb.ok .fb-i{background:var(--ok)}
.fb.no{border-color:var(--no);background:var(--no-bg)} .fb.no .fb-i{background:var(--no)}
.fb.warn{border-color:var(--lamp-edge);background:var(--warn-bg)} .fb.warn .fb-i{background:var(--lamp-edge);color:var(--lamp-ink)}
.fb .fb-p{display:block;font:700 0.875rem/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin-bottom:0.1875rem}
.fb.ok .fb-p{color:var(--ok)} .fb.no .fb-p{color:var(--no)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:0.625rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;min-height:3rem;padding:0.625rem 1.375rem;border-radius:0.75rem;border:2px solid var(--lamp-edge);background:var(--lamp);color:var(--lamp-ink);font:700 1.1875rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.btn:disabled{opacity:.38;cursor:default}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink)}
.btn.small{min-height:2.5rem;padding:0.375rem 0.875rem;font-size:1rem}
.btn.plain{background:none;border-color:transparent;color:var(--ink2);padding-left:0.375rem;padding-right:0.375rem}
.btn.onbench{background:var(--bench2);border-color:var(--bench3);color:var(--bench-ink)}
.btn.onbench[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}

.chips{display:flex;flex-wrap:wrap;gap:0.5rem}
.chip{min-height:2.625rem;padding:0.375rem 0.875rem;border-radius:0.625rem;border:2px solid var(--line);background:var(--paper);font-weight:600}
.chip[aria-pressed="true"],.chip.is-sel{border-color:var(--el);background:var(--el-soft)}
.chip:disabled{opacity:.45;cursor:default}
.chip.sym{font:700 1.375rem/1 var(--f-display);min-width:3.25rem}
.chip.is-ok{border-color:var(--ok);background:var(--ok-bg)}
.chip.is-no{border-color:var(--no);background:var(--no-bg)}

.rows{display:flex;flex-direction:column;gap:0.5625rem}
.row{border:2px solid var(--line);border-radius:0.75rem;padding:0.625rem 0.75rem;display:flex;flex-direction:column;gap:0.5rem}
.row-t{display:flex;gap:0.625rem;align-items:center;line-height:1.38}
.row-t svg{flex:none;width:2.125rem;height:2.125rem;color:var(--ink)}
.row .chips{gap:0.375rem}
.row .chip{min-height:2.375rem;padding:0.25rem 0.75rem;font-size:0.96875rem}
.row-fb{font-size:0.9375rem;color:var(--ink2);line-height:1.38}
.row.is-ok{border-color:var(--ok)} .row.is-no{border-color:var(--no)}
.mark{font:700 0.9375rem var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.mark.ok{color:var(--ok)} .mark.no{color:var(--no)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:0.5625rem 0.75rem}
.match .chip{width:100%;text-align:left;line-height:1.25;font-size:0.96875rem}
.match .chip.done{border-style:dashed;opacity:.9;cursor:default}
.match .chip.done b{font:700 0.875rem var(--f-display);margin-right:0.375rem;color:var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}60%{transform:translateX(0.3125rem)}100%{transform:none}}

.order-list{display:flex;flex-direction:column;gap:0.375rem;counter-reset:o}
.order-slot{display:flex;gap:0.625rem;align-items:center;min-height:2.625rem;padding:0.375rem 0.75rem;border-radius:0.625rem;border:2px dashed var(--line);color:var(--ink2)}
.order-slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.order-slot::before{counter-increment:o;content:counter(o);font:700 1.125rem var(--f-display);width:1.125rem}

.grid3{display:grid;grid-template-columns:minmax(6rem,1.3fr) 1fr 1fr;gap:0.375rem;align-items:stretch}
.grid3 .gh{font:600 0.8125rem/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:2px 0.25rem;align-self:end}
.grid3 .gr{display:flex;align-items:center;font-weight:600;padding:0 0.25rem}
.cell{min-height:3.125rem;border:2px dashed var(--line);border-radius:0.625rem;background:none;font:700 1.375rem/1 var(--f-display);display:grid;place-items:center}
.cell.filled{border-style:solid;border-color:var(--el);background:var(--el-soft)}
.cell.is-ok{border-color:var(--ok);background:var(--ok-bg)} .cell.is-no{border-color:var(--no);background:var(--no-bg)}
.cell small{font:500 0.75rem var(--f-body);color:var(--ink2);display:block;margin-top:2px}

.numrow{display:flex;flex-wrap:wrap;gap:0.625rem;align-items:center}
.numrow input{width:8rem;min-height:3rem;padding:0.375rem 0.75rem;border:2px solid var(--line);border-radius:0.625rem;background:var(--paper);font:700 1.5rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.numrow input:focus{border-color:var(--el);outline:none}
.numrow label{font:700 1.5rem var(--f-display)}

.calc{align-self:flex-start;background:var(--bench);color:var(--bench-ink);border-radius:0.75rem;padding:0.625rem 0.75rem;display:flex;flex-direction:column;gap:0.375rem;min-width:14.375rem}
.calc .cd{background:#c5d3b6;color:#14241a;border-radius:0.375rem;padding:0.375rem 0.625rem;text-align:right;font:600 1.4375rem/1.1 var(--f-mono);letter-spacing:.02em}
.calc small{font:600 0.78125rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--bench-ink2)}

.ctrl{display:flex;flex-direction:column;gap:0.375rem}
.ctrl label{display:flex;justify-content:space-between;font-weight:600}
.ctrl input[type=range]{width:100%;height:2.25rem;accent-color:var(--el)}
.mtab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:0.9375rem}
.mtab th,.mtab td{border:1px solid var(--line);padding:0.3125rem 0.25rem;text-align:center;min-width:2.125rem}
.mtab th{font:600 0.875rem var(--f-display);letter-spacing:.04em;background:var(--el-soft);text-align:left;padding-left:0.5rem;white-space:nowrap}
.tabwrap{overflow-x:auto}
.plotbox{border:1px solid var(--line);border-radius:0.625rem;padding:0.25rem;background:var(--paper)}
.plot{display:block;width:100%;height:auto;max-height:15rem;touch-action:manipulation}
.plot .ax{stroke:var(--ink);stroke-width:1.6;fill:none}
.plot .gr{stroke:var(--line);stroke-width:1}
.plot text{font:500 11px var(--f-body);fill:var(--ink2)}
.plot .axt{font:700 14px var(--f-display);fill:var(--ink)}
.plot .pt{fill:var(--el);stroke:var(--paper);stroke-width:1.5}
.plot .pt.lampp{fill:#d9822b}
.plot .miss{stroke:var(--no);stroke-width:2.4;stroke-linecap:round}
.plot .cv{fill:none;stroke:var(--el);stroke-width:2.6;stroke-linecap:round}
.plot .cv.lampc{stroke:#d9822b}
.plot .cv.ref{stroke:var(--ink2);stroke-width:1.6;stroke-dasharray:5 5}
.plot .lg{font:600 12px var(--f-body);fill:var(--ink)}
.plot.tap{cursor:crosshair}

.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.5rem}
.tray .chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0.5rem 0.25rem;font-size:0.90625rem;line-height:1.2;text-align:center}
.tray .chip svg{width:2.75rem;height:1.875rem;color:var(--ink)}
.tray .chip .mark{font-size:0.8125rem}
.tray .chip:disabled{opacity:1}
.chip small{display:block;font:500 0.75rem var(--f-body);color:var(--ink2)}

.checks{display:flex;flex-direction:column;gap:0.5rem}
.check{display:flex;gap:0.625rem;align-items:flex-start;padding:0.5625rem 0.75rem;border:2px solid var(--line);border-radius:0.75rem;line-height:1.38;color:var(--ink2)}
.check::before{content:"";flex:none;width:1.25rem;height:1.25rem;border-radius:50%;border:2px solid var(--ink2);margin-top:1px}
.check.on{border-color:var(--ok);color:var(--ink)}
.check.on::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 0.1875rem var(--paper)}

/* ---------- Startseite ---------- */
.start{display:grid;gap:1.125rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.start{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center}}
.start h1{font:700 clamp(2.5rem,6vw,4.75rem)/.86 var(--f-display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.start h1 span{color:var(--el)}
.start .lead{font-size:1.15625rem;max-width:34em;margin-top:0.75rem}
.start .facts{display:flex;flex-wrap:wrap;gap:0.375rem 1.125rem;margin-top:0.75rem;font:600 0.9375rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0.625rem}
.mode{display:flex;flex-direction:column;gap:0.1875rem;text-align:left;padding:0.75rem 0.875rem;border:2px solid var(--line);border-radius:0.75rem;background:var(--paper)}
.mode b{font:700 1.375rem/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.mode span{font-size:0.90625rem;color:var(--ink2);line-height:1.3}
.mode[aria-pressed="true"]{border-color:var(--el);background:var(--el-soft)}
.names{display:flex;flex-wrap:wrap;gap:0.5rem}
.names input{flex:1 1 8.125rem;min-width:0;min-height:2.875rem;padding:0.375rem 0.75rem;border:2px solid var(--line);border-radius:0.625rem;background:var(--paper)}
.names input:focus{border-color:var(--el);outline:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:0.875rem;padding:1.125rem;display:flex;flex-direction:column;gap:0.875rem}
.card h2{font:700 1.5rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.note{font-size:0.90625rem;color:var(--ink2);line-height:1.4}

/* ---------- Auswertung ---------- */
.sum{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.sum{grid-template-columns:minmax(0,21.25rem) minmax(0,1fr);align-items:start}}
.score{display:flex;flex-direction:column;align-items:center;gap:0.375rem;text-align:center}
.score svg{width:11.875rem;height:11.875rem}
.score .ring-bg{fill:none;stroke:var(--line);stroke-width:14}
.score .ring{fill:none;stroke:var(--lamp);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s}
.score .big{font:700 46px var(--f-display);fill:var(--ink)}
.score .of{font:600 15px var(--f-display);letter-spacing:.1em;fill:var(--ink2)}
.who{font-weight:600}
.srow{display:grid;grid-template-columns:2.125rem minmax(0,1fr) auto;gap:0.25rem 0.625rem;align-items:center;padding:0.5rem 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .n{font:700 1.75rem/1 var(--f-display);color:var(--el)}
.srow .t{font-weight:600;line-height:1.25}
.srow .t small{display:block;font-weight:400;color:var(--ink2);font-size:0.875rem}
.srow .p{font:700 1.1875rem var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:2 / 4;height:0.5rem;border-radius:6.1875rem;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6.1875rem;background:var(--ok)}
.bar.low i{background:var(--lamp-edge)}
.srow .again{grid-column:2 / 4;justify-self:start}

/* ---------- Übersicht / Dialog / Toast ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(6,10,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:4rem 1rem 1rem;overflow:auto}
.sheet[hidden]{display:none}
.sheet .card{width:min(35rem,100%)}
.sheet .srow{grid-template-columns:2.125rem minmax(0,1fr) auto}
.sheet .srow button.go{border:0;background:none;text-align:left;padding:0;font-weight:600}
.sheet .srow button.go:disabled{color:var(--ink2);cursor:default}
#toast{position:fixed;left:50%;bottom:1.125rem;transform:translate(-50%,1.875rem);z-index:50;max-width:calc(100% - 2rem);background:var(--ink);color:var(--paper);padding:0.625rem 1rem;border-radius:0.75rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- Bildschirmfüllend: Schriftgröße wird per Skript an die Fensterhöhe angepasst ---------- */
html.fit main{padding:.75rem 1rem 1rem}
html.fit .scene{max-height:var(--workH,none)}
html.fit .scene > svg,html.fit .scene > .sc-fit{flex:0 1 auto;min-height:0}
html.fit .scene > .sc-fit{display:flex;flex-direction:column;justify-content:center}
html.fit .scene > .sc-fit > svg{flex:0 1 auto;min-height:0;width:100%;height:auto}
html.fit .scene > .sc-row,html.fit .scene > .sc-cap,html.fit .scene > .sc-tag,html.fit .scene > .sc-split{flex:none}
.start .scene svg{max-height:36vh}
html.fit main{max-width:min(100%,1560px)}
html.fit .work{grid-template-columns:minmax(0,1fr) minmax(0,var(--taskfr,1.12fr))}
html.fit .work.no-scene{grid-template-columns:minmax(0,1fr)}
html.fit .opts{grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
html.fit .opts-img{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
html.fit .rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr))}
.meas{display:grid;gap:.75rem}
.meas-l{display:flex;flex-direction:column;gap:.75rem;min-width:0}
html.fit .meas{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}

@media (max-width:560px){
  body{font-size:16.5px}
  .logo span{display:none}
  .top{gap:6px;padding:6px 12px}
  .st-no{font-size:44px} .st-head h1{font-size:28px}
  .task{padding:14px} .q{font-size:18px}
  .match{gap:8px}
  .match .chip{padding:6px 9px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .lab.edit .sock-r,.armed,.shake,.wire.hot .w-in,.short .bat-hot,.spark.on{animation:none}
  .bulb,.lever,#toast,.score .ring{transition:none}
}

/* ---------- Mathematik-Satz ---------- */
.mx{font-family:"ILV Math","ILV Math Sym","STIX Two Text","Cambria","Times New Roman",serif;font-size:1.08em;font-weight:400;white-space:nowrap}
.mx i{font-style:italic;padding-right:.04em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.15}
.fr > span{display:block;padding:0 .18em;text-align:center}
.fr > span:first-child{border-bottom:.08em solid currentColor;padding-bottom:.06em}
.fr > span:last-child{padding-top:.06em}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin-right:.18em;line-height:1}
.lim > b{font-weight:400;font-style:normal}
.lim > small{font-size:.62em;margin-top:.12em;white-space:nowrap}
.big-mx{font-size:1.35em}

/* Merke-Kasten auf der Aufgabenkarte */
.info{display:flex;flex-direction:column;gap:.25rem;padding:.625rem .875rem;border-radius:.75rem;background:var(--el-soft);border-left:.375rem solid var(--el);line-height:1.42}
.info > b{font:700 .875rem/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--el)}

/* Lückentext und Formel-Lücken */
.cloze{font-size:1.125rem;line-height:2.35;text-wrap:pretty}
.cloze.formula{font-size:1.25rem;line-height:2.6;text-align:center}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:3.5rem;min-height:2.375rem;padding:2px .625rem;margin:0 2px;vertical-align:middle;border:2px dashed var(--ink2);border-radius:.5625rem;background:var(--paper);font:600 1.0625rem/1.2 var(--f-body);color:var(--ink)}
.formula .slot{min-width:3rem;font-size:1.125rem}
.slot.filled{border-style:solid;border-color:var(--el);background:var(--el-soft)}
.slot.is-ok{border-color:var(--ok);background:var(--ok-bg);border-style:solid}
.slot.is-no{border-color:var(--no);background:var(--no-bg);border-style:solid}
.chip .mx,.slot .mx,.opt .mx{font-size:1.05em}

/* ---------- Tafel (dunkle Bühne) mit Funktionsgraphen ---------- */
.board{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board .gr{stroke:#1d2a50;stroke-width:1}
.board .gr2{stroke:#273763;stroke-width:1}
.board .ax{stroke:#8f9cc0;stroke-width:1.6;fill:none}
.board .ah{fill:#8f9cc0}
.board .tk{font:500 11px var(--f-body);fill:#8f9cc0}
.board .axn{font:italic 400 16px "ILV Math","ILV Math Sym","STIX Two Text","Cambria","Times New Roman",serif;fill:#d4dcf0}
.board .cv{fill:none;stroke:#ffc52e;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.board .cv.b{stroke:#7fb0ff}
.board .cv.g{stroke:#4fd494}
.board .cv.thin{stroke-width:1.8}
.board .cv.ghost{stroke:#ffc52e;opacity:.28}
.board .as{stroke:#ff8a80;stroke-width:1.8;stroke-dasharray:7 6;fill:none}
.board .ln{stroke:#4fd494;stroke-width:2.4;stroke-linecap:round;fill:none}
.board .ln.b{stroke:#7fb0ff}
.board .ln.w{stroke:#d4dcf0;stroke-width:1.6}
.board .ln.dash{stroke-dasharray:6 5}
.board .tri{stroke:#d4dcf0;stroke-width:1.6;fill:rgba(212,220,240,.08)}
.board .pt{fill:#ffc52e;stroke:#0d1630;stroke-width:2}
.board .pt.g{fill:#4fd494} .board .pt.b{fill:#7fb0ff} .board .pt.w{fill:#d4dcf0} .board .pt.r{fill:#ff8a80}
.board .pt.hole{fill:#0d1630;stroke:#ffc52e;stroke-width:2}
.board .lb{font:600 13px var(--f-body);fill:#d4dcf0;paint-order:stroke;stroke:#0d1630;stroke-width:4px;stroke-linejoin:round}
.board .lb.y{fill:#ffc52e} .board .lb.g{fill:#4fd494} .board .lb.r{fill:#ff8a80} .board .lb.b{fill:#7fb0ff}
.board .lb.mx{font:italic 400 17px "ILV Math","ILV Math Sym","STIX Two Text","Cambria","Times New Roman",serif}
.board .miss{stroke:#ff8a80;stroke-width:2.6;stroke-linecap:round}
.board .hitpt{fill:#4fd494;stroke:#0d1630;stroke-width:2}
.board .arc{fill:rgba(255,197,46,.18);stroke:#ffc52e;stroke-width:1.6}
.board.tap{cursor:crosshair}
.board .area{fill:rgba(127,176,255,.08)}

/* helle Variante (Antwortkarten, Zeichenfeld auf der Aufgabenkarte) */
.board.paper .gr{stroke:var(--line);opacity:.55}
.board.paper .gr2{stroke:var(--line)}
.board.paper .ax{stroke:var(--ink2)}
.board.paper .ah{fill:var(--ink2)}
.board.paper .tk{fill:var(--ink2)}
.board.paper .axn{fill:var(--ink)}
.board.paper .cv{stroke:var(--el)}
.board.paper .as{stroke:var(--no)}
.board.paper .pt{fill:var(--el);stroke:var(--paper)}
.board.paper .hitpt{fill:var(--ok);stroke:var(--paper)}
.board.paper .ln{stroke:var(--ok)}
.board.paper .lb{fill:var(--ink);stroke:var(--paper)}
.plotbox{border:1px solid var(--line);border-radius:.625rem;padding:.25rem;background:var(--paper)}
.plot-read{font-size:.90625rem;color:var(--ink2);min-height:1.4em}

/* Regler auf der Tafel */
.sc-ctrls{display:flex;flex-wrap:wrap;gap:.25rem 1rem;padding:.125rem .625rem .375rem}
.sc-ctrl{flex:1 1 11rem;display:flex;flex-direction:column;gap:.125rem;min-width:0}
.sc-ctrl label{display:flex;justify-content:space-between;gap:.5rem;font:600 .9375rem/1.2 var(--f-body);color:var(--bench-ink)}
.sc-ctrl label output{font:700 1.0625rem/1.2 var(--f-display);color:#ffc52e;font-variant-numeric:tabular-nums}
.sc-ctrl input[type=range]{width:100%;height:2rem;accent-color:#ffc52e;margin:0}
.sc-read{font:600 1rem/1.35 var(--f-body);color:var(--bench-ink);text-align:center;padding:0 .5rem .25rem}
.sc-read b{color:#ffc52e;font-variant-numeric:tabular-nums}
.sc-tab{border-collapse:collapse;margin:0 auto .375rem;font-variant-numeric:tabular-nums;font-size:.9375rem;color:var(--bench-ink)}
.sc-tab th,.sc-tab td{border:1px solid var(--bench3);padding:.25rem .5rem;text-align:center;min-width:3rem}
.sc-tab th{color:var(--bench-ink2);font:italic 400 1.0625rem "ILV Math","ILV Math Sym","STIX Two Text","Cambria","Times New Roman",serif}
.sc-tab td.new{color:#ffc52e}

/* Logo-Kette: Punkte auf einer Kurve */
.chain .cp{fill:var(--paper);stroke:var(--ink2);stroke-width:1.6;transition:fill .4s}
.chain .is-done .cp{fill:var(--lamp);stroke:var(--lamp-edge)}
.chain .is-cur .cp{stroke:var(--el);stroke-width:2.6}
.chain .blk{display:block;width:1px;height:1.25rem;background:var(--line);margin:0 .25rem;flex:none}

.ui > .btn{align-self:flex-start}
.numrow .mx{font-size:1.25rem}

.cloze.formula{overflow-x:auto;overflow-y:hidden}
@media (max-width:560px){
  .chain button{flex:0 1 1.125rem;min-width:.75rem;width:1.125rem}
  .chain svg{width:.875rem}
  .chain .blk{margin:0 .0625rem}
  .readout{font-size:1.0625rem}
  .cloze.formula{font-size:1.0625rem}
}

/* Übersicht und Auswertung: 16 Stationen in zwei Spalten, damit alles auf einen Bildschirm passt */
@media (min-width:700px){
  .srows{display:grid;grid-template-rows:repeat(var(--n,8),auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);column-gap:1.75rem}
  .sheet .card{width:min(62rem,100%)}
  .sheet{padding-top:2rem}
  .srows .srow{padding:.375rem 0}
  .srows .srow.colstart{border-top:0}
}
.chip.pm{font-size:1.0625rem;min-width:3.25rem}

/* ---------- Tafel: Licht, Leuchtspur, Bewegung ---------- */
.scene{background:radial-gradient(120% 85% at 28% 0%,#17254f 0%,#0d1630 62%);box-shadow:0 .5rem 1.5rem -1rem rgba(13,22,48,.55)}
.board .cvg{fill:none;stroke:#ffc52e;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.13}
.board .cvg.b{stroke:#7fb0ff} .board .cvg.g{stroke:#4fd494} .board .cvg.p{stroke:#ff9ecb}
.board .cvg.thin{stroke-width:6;opacity:.12} .board .cvg.ghost{opacity:.05}
.board .cv.p{stroke:#ff9ecb}
.board.paper .cvg{stroke:var(--el);opacity:.1}
.board .cv.draw{animation:cvdraw .95s cubic-bezier(.35,.55,.25,1) forwards}
.board .cvg.fadein{animation:fadeglow 1.1s ease-out both}
@keyframes cvdraw{to{stroke-dashoffset:0}}
@keyframes fadeglow{from{opacity:0}}
.board .pt,.board .hitpt{transform-box:fill-box;transform-origin:center;animation:ptpop .4s cubic-bezier(.3,1.5,.5,1) both}
@keyframes ptpop{from{transform:scale(0)}}
.board .ln,.board .as,.board .tri,.board .lb,.board .arc{animation:fadein .5s ease-out both}
@keyframes fadein{from{opacity:0}}
.board .ringfx{fill:none;stroke:#4fd494;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ringfx .8s ease-out forwards;pointer-events:none}
.board .ringfx.y{stroke:#ffc52e}
@keyframes ringfx{from{transform:scale(.5);opacity:.95}to{transform:scale(4.2);opacity:0}}
.board.still *,.board .noanim,.board .noanim *{animation:none!important}
.board .wait{font:600 13px var(--f-body);fill:#8f9cc0;letter-spacing:.02em}
.board.paper .ringfx{stroke:var(--ok)}

/* Bildergalerie auf der Bühne */
.sc-panels{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:.5rem;padding:.25rem}
.sc-panel{border:1px solid var(--bench3);border-radius:.625rem;padding:.125rem .125rem .25rem;opacity:.42;filter:saturate(.35);transition:opacity .5s,filter .5s,border-color .5s,box-shadow .5s;min-width:0}
.sc-panel.on{opacity:1;filter:none;border-color:#ffc52e;box-shadow:0 0 0 1px rgba(255,197,46,.35),0 0 1.25rem -.375rem rgba(255,197,46,.55)}
.sc-pcap{font:600 .84375rem/1.25 var(--f-body);color:var(--bench-ink2);text-align:center;padding:0 .375rem;min-height:1.25em}
.sc-panel.on .sc-pcap{color:#ffc52e}
html.fit .scene > .sc-panels{flex:0 1 auto;min-height:0}

/* ---------- Fortschrittsleiste: Punkte auf einer Linie, je Block eine Gruppe ---------- */
.chain .blk{display:none}
.chain button{width:1.875rem;flex:0 1 1.875rem}
.chain button::before{top:.5625rem;height:2px;background:var(--line);opacity:1;transition:background .4s}
.chain button.is-done::before,.chain button.is-cur::before{background:var(--lamp-edge)}
.chain button.blk-start{margin-left:.875rem}
.chain button.blk-start::before{display:none}
.chain button:disabled{opacity:1}
.chain button:disabled .cp{stroke:var(--line)}
.chain .cp{transform-box:fill-box;transform-origin:center;transition:fill .4s,stroke .4s,transform .3s}
.chain .is-cur .cp{transform:scale(1.18)}
.chain .is-done .cp{fill:var(--lamp);stroke:var(--lamp-edge)}
@media (max-width:560px){.chain button.blk-start{margin-left:.3125rem}}

/* ---------- kleine Belohnungen ---------- */
.burst{position:fixed;z-index:60;pointer-events:none;width:0;height:0}
.burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--c,#ffc52e);opacity:0;animation:burst .8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.readout.bump > span{animation:bump .5s ease-out}
@keyframes bump{30%{transform:scale(1.28);color:var(--lamp-edge)}}
.readout > span{display:inline-block;transform-origin:right center}
.confetti{position:fixed;top:0;left:0;right:0;bottom:0;z-index:55;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-1.25rem;width:.5rem;height:.875rem;border-radius:2px;background:var(--c);animation:fall var(--t,3s) linear var(--d,0s) forwards}
@keyframes fall{to{transform:translate(var(--dx,0),108vh) rotate(var(--r,540deg))}}
.fb{animation:fbin .28s ease-out}
@keyframes fbin{from{opacity:0;transform:translateY(.375rem)}}
.opt.is-ok,.slot.is-ok,.row.is-ok{animation:okpulse .45s ease-out}
@keyframes okpulse{40%{box-shadow:0 0 0 .375rem rgba(31,157,99,.22)}}

/* Startseite: die vier Blöcke als Wegweiser */
.road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.road > button{font:inherit;text-align:left;cursor:pointer;display:block;width:100%;background:var(--bench);border:1px solid var(--bench3);border-radius:.75rem;padding:.25rem .25rem .5rem;color:var(--bench-ink);min-width:0;background:radial-gradient(120% 85% at 28% 0%,#17254f 0%,#0d1630 62%)}
.road b{display:block;font:700 .8125rem/1.15 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:0 .375rem;color:#ffc52e}
.road span{display:block;font-size:.8125rem;line-height:1.25;padding:.125rem .375rem 0;color:var(--bench-ink)}
@media (max-width:560px){.road{grid-template-columns:repeat(2,minmax(0,1fr))}}
.start .scene svg{max-height:40vh}

@media (prefers-reduced-motion:reduce){
  .board *,.fb,.opt,.slot,.row,.readout > span,.burst i,.confetti i{animation:none!important}
  .sc-panel,.chain .cp{transition:none}
}

.mx sup{font-size:.68em;vertical-align:.5em;line-height:0;margin-left:.04em}
.mx sub{font-size:.68em;vertical-align:-.28em;line-height:0}
.lim > small sup{vertical-align:.4em}
.board .wait{paint-order:stroke;stroke:#0d1630;stroke-width:6px;stroke-linejoin:round}
.board .hill{fill:#141f44} .board .hill.far{fill:#101a3a}
.board .star{fill:#d4dcf0}

.road > button:hover{border-color:#ffc52e}
.startbtns{display:flex;flex-wrap:wrap;gap:.625rem;align-items:center}
.nav .solve{color:var(--el)}
@media (min-width:700px){
  .sheet{padding-top:1rem}
  .sheet .card{padding:.875rem 1.125rem;gap:.5rem}
  .sheet .srows .srow{padding:.1875rem 0;gap:.0625rem .625rem}
  .sheet .srow .n{font-size:1.375rem}
  .sheet .srow .t small{line-height:1.2}
}

/* ---------- Lernpfad Kreisbewegung und Gravitation: Ergänzungen ---------- */
canvas.stage{display:block;width:100%;height:auto;object-fit:contain}
html.fit .scene > canvas.stage{flex:0 1 auto;min-height:0}
.start .scene canvas{max-height:40vh}
.sc-say{min-height:2.9em;display:flex;align-items:center;justify-content:center;text-wrap:balance;padding-top:.125rem}
.sc-say .ok{color:#4fd494}.sc-say .no{color:#ff8a80}.sc-say .you{color:#ff9ecb}
.sc-say b{color:#ffc52e}
.sc-say .ok b,.sc-say .no b,.sc-say .you b{color:inherit}
.mx{font-family:"ILV Math","ILV Greek","ILV Math Sym","STIX Two Text","Cambria","Times New Roman",serif}
.rad{display:inline-block;border-top:.07em solid currentColor;padding:.05em .14em 0 .1em;margin-left:.02em;line-height:1.15;vertical-align:middle}
.rad .fr{margin-top:.1em}
.numrow label{display:inline-flex;align-items:center;gap:.25rem}
.numrow label .mx{font-size:1.3rem}
.numrow input.wide{width:13rem}
.numrow .unit{font:700 1.375rem/1 var(--f-display);color:var(--ink2)}
.numrow .chip.pm{min-height:3rem}
.info .fr,.q .fr,.fb .fr,.opt .fr{font-size:.92em}
.opt .opt-t{align-self:center}
/* 28 Stationen in sieben Blöcken */
.chain button{width:1.5rem;flex:0 1 1.5rem;min-width:.7rem}
.chain button.blk-start{margin-left:.625rem}
.chain svg{width:1rem}
@media (max-width:900px){.chain button.blk-start{margin-left:.25rem}.chain svg{width:.75rem}.logo span{display:none}}
@media (min-width:700px){.sheet .card{width:min(86rem,100%)}}
.road{grid-template-columns:repeat(7,minmax(0,1fr))}
.road svg{display:block;width:100%;height:auto}
.road span{font-size:.75rem;line-height:1.2}
@media (max-width:900px){.road{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.road{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Auswertung: „Nochmal“ steht neben dem Balken, damit 28 Stationen auf einen Bildschirm passen */
.srow .again{grid-column:3;grid-row:2;min-height:0;padding:0 .25rem;font-size:.8125rem;line-height:1;justify-self:end;color:var(--el)}
.srow:has(.again) .bar{grid-column:2 / 3}
@media (max-width:560px){.chain button{flex:0 1 .6rem;width:.6rem;min-width:.4rem}.chain svg{width:.55rem}.chain button.blk-start{margin-left:.2rem}}
</style>

<script>
'use strict';
/* ===== Hilfsfunktionen ===== */
const SVGNS = 'http://www.w3.org/2000/svg';
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
/* Kurve wird beim Erscheinen gezeichnet (Länge wird gemessen, das läuft in jedem Browser gleich) */
function drawIn(p, glow) {
  let len = 0; try { len = p.getTotalLength(); } catch (e) { len = 0; }
  if (!len || !isFinite(len)) return;
  p.style.strokeDasharray = len + ' ' + len; p.style.strokeDashoffset = len;
  p.classList.add('draw'); if (glow) glow.classList.add('fadein');
  let done = false;
  const end = () => { if (done) return; done = true; p.classList.remove('draw'); p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; };
  p.addEventListener('animationend', end); setTimeout(end, 1500);
}
const NB = ' ';
function T(s) { return String(s == null ? '' : s); }
function de(x, d) { let s = Number(x).toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace('.', ',').replace('-', '−'); }
/* Zahl ohne überflüssige Nullen, deutsches Komma, echtes Minuszeichen */
function dn(x, d = 3) { let s = (+x).toFixed(d).replace(/\.?0+$/, ''); if (s === '-0') s = '0'; return s.replace('.', ',').replace('-', '−'); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function setAttrs(e, a) {
  if (!a) return;
  for (const k in a) {
    const v = a[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.setAttribute('class', v);
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
}
function addKids(e, kids) { for (const k of kids.flat(Infinity)) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); } }
function el(tag, attrs, ...kids) { const e = document.createElement(tag); setAttrs(e, attrs); addKids(e, kids); return e; }
function sv(tag, attrs, ...kids) { const e = document.createElementNS(SVGNS, tag); setAttrs(e, attrs); addKids(e, kids); return e; }

/* ===== Formelsatz =====
   M(`f(x) = 2x + 1`)  setzt Variablen kursiv, ersetzt - durch das Minuszeichen.
   F(z, n)             Bruch,  L(unten)  lim mit Index. */
const SUPS = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', 'ⁿ': 'n', '⁻': '−', '⁺': '+' };
const SUBS = { '₀': '0', '₁': '1', '₂': '2' };
function M(s) {
  s = String(s).replace(/-/g, '−');
  /* hochgestellte und tiefgestellte Zeichen sauber setzen: xⁿ⁻¹ wird zu x<sup>n−1</sup> */
  s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹ⁿ⁻⁺]+/g, m => '<sup>' + [...m].map(ch => SUPS[ch]).join('') + '</sup>').replace(/[₀₁₂]+/g, m => '<sub>' + [...m].map(ch => SUBS[ch]).join('') + '</sub>');

/* Geostationärer Satellit: bleibt er über der Schüssel? */
SC.geo = () => ctx => {
  const st = new Stage(ctx, { seed: 101 }), say = sayer(ctx), cx = 360, cy = 256, R = 78, Ro = 196, om = 0.42; let a = 0.5, g = 0, ratio = null;
  ctx.cap('Blick von oben auf den Nordpol · Zeitraffer');
  st.draw = (c, dt) => {
    a += om * dt; st.stars(); earth(c, cx, cy, R, a); circ(c, cx, cy, Ro, COL.ink2, 1.4, { dash: [6, 7], glow: false, a: 0.7 });
    const ux = Math.cos(a), uy = -Math.sin(a), hx = cx + R * ux, hy = cy + R * uy, sx = cx + Ro * ux, sy = cy + Ro * uy;
    seg(c, hx, hy, sx, sy, COL.amber, 2.4, { dash: [6, 6], off: -st.t * 30 });
    c.save(); c.translate(hx, hy); c.rotate(Math.atan2(uy, ux)); c.fillStyle = COL.amber; c.strokeStyle = COL.bench; c.lineWidth = 1.2; c.beginPath(); c.arc(10, 0, 13, Math.PI * 0.62, Math.PI * 1.38); c.closePath(); c.fill(); c.stroke(); c.fillRect(-2, -2, 8, 4); c.restore(); pill(c, 'Schüssel', hx - ux * 34, hy - uy * 34, COL.amber, { size: 13 });
    satIcon(c, sx, sy, Math.atan2(uy, ux) + Math.PI / 2, 1, '#fff');
    if (ratio !== null) { g += om * ratio * dt; const x = cx + Ro * Math.cos(g), y = cy - Ro * Math.sin(g); ghostMark(c, x, y, 'dein Wert', y < cy ? -32 : 34); say(ratio === 1 ? 'ok' : 'you', ratio === 1 ? 'Dein Satellit bleibt über der Schüssel stehen: passt.' : 'Mit deiner Umlaufdauer wandert der Satellit aus der Richtung der Schüssel.'); }
    else say('', 'Der Satellit bleibt genau über der Schüssel, während sich die Erde dreht.');
  };
  return { onTry(v, hit, ans) { ratio = hit ? 1 : ratioOf(v, ans, 'T'); g = a; }, onDone() { ratio = 1; g = a; } };
};

/* Moonraker: Messbild mit Raster und Winkelskala. cfg.which: 'a' Winkel | 'r' Radius */
SC.moon = cfg => ctx => {
  const st = new Stage(ctx), say = sayer(ctx), u = 72, x0 = 112, ya = 300, xc = x0 + 5.3 * u, al = 37 * Math.PI / 180; let sv = null, ok = false;
  ctx.cap('eigene Schemazeichnung der Zentrifuge, Seitenansicht · 1 Kästchen = 1 m');
  st.draw = (c, dt) => {
    c.save(); c.strokeStyle = COL.grid; c.lineWidth = 1; c.beginPath(); for (let x = x0 % u; x < 720; x += u) { c.moveTo(x, 0); c.lineTo(x, 500); } for (let y = ya % u; y < 500; y += u) { c.moveTo(0, y); c.lineTo(720, y); } c.stroke(); c.restore();
    seg(c, x0, 14, x0, 486, COL.coral, 2, { dash: [10, 7] }); tx(c, 'Drehachse', x0 + 10, 32, { al: 'left', col: COL.coral, size: 15 });
    c.save(); const mg = c.createLinearGradient(x0 - 22, 0, x0 + 22, 0); mg.addColorStop(0, '#5d6a94'); mg.addColorStop(0.5, '#c9d2ea'); mg.addColorStop(1, '#4a5680'); c.fillStyle = mg; rr(c, x0 - 18, ya - 6, 36, 118, 5); c.fill(); rr(c, x0 - 52, ya + 104, 104, 20, 6); c.fill(); const ag = c.createLinearGradient(0, ya - 8, 0, ya + 8); ag.addColorStop(0, '#c9d2ea'); ag.addColorStop(1, '#55618a'); c.fillStyle = ag; rr(c, x0 - 74, ya - 8, xc - x0 + 74, 16, 6); c.fill(); c.fillStyle = '#55618a'; rr(c, x0 - 96, ya - 22, 40, 44, 6); c.fill(); c.restore();
    if (cfg.which === 'r') { seg(c, x0, ya + 150, x0 + u, ya + 150, COL.ink, 3, { glow: false }); seg(c, x0, ya + 143, x0, ya + 157, COL.ink, 2, { glow: false }); seg(c, x0 + u, ya + 143, x0 + u, ya + 157, COL.ink, 2, { glow: false }); tx(c, '1 m', x0 + u / 2, ya + 176, { size: 16 }); }
    c.save(); c.translate(xc, ya); c.rotate(-al); const kg = c.createLinearGradient(-26, 0, 26, 0); kg.addColorStop(0, '#eef1f8'); kg.addColorStop(1, '#8f9cc0'); c.shadowColor = 'rgba(212,220,240,.35)'; c.shadowBlur = 16; c.fillStyle = kg; rr(c, -26, -46, 52, 92, 13); c.fill(); c.shadowBlur = 0; c.strokeStyle = COL.bench; c.lineWidth = 1.4; c.stroke(); c.fillStyle = '#16305f'; rr(c, -14, -32, 28, 24, 6); c.fill(); c.restore();
    ball(c, xc, ya, 5, COL.amber);
    if (cfg.which === 'a') {
      seg(c, xc, ya, xc, ya - 2.55 * u, COL.ink, 1.6, { dash: [6, 6], glow: false }); arrow(c, xc, ya, xc - Math.sin(al) * 1.8 * u, ya - Math.cos(al) * 1.8 * u, COL.amber, { w: 3.6 }); pill(c, 'Kapselachse', xc - Math.sin(al) * 1.1 * u - 66, ya - Math.cos(al) * 1.1 * u, COL.amber, { size: 13 });
      for (let d = 0; d <= 70; d += 5) { const q = d * Math.PI / 180, r1 = 2.05 * u, r2 = (d % 10 ? 2.14 : 2.25) * u; seg(c, xc - Math.sin(q) * r1, ya - Math.cos(q) * r1, xc - Math.sin(q) * r2, ya - Math.cos(q) * r2, COL.ink, d % 10 ? 1.3 : 2.2, { glow: false }); if (d % 10 === 0) tx(c, d + '°', xc - Math.sin(q) * 2.5 * u, ya - Math.cos(q) * 2.5 * u + 6, { size: 15 }); }
      gl(c, COL.ink2, 1.4, c => c.arc(xc, ya, 2.05 * u, -Math.PI / 2 - 70 * Math.PI / 180, -Math.PI / 2), { glow: false });
      if (sv != null) { const q = (ok ? 37 : clamp(sv, 0, 89)) * Math.PI / 180; seg(c, xc, ya, xc - Math.sin(q) * 2 * u, ya - Math.cos(q) * 2 * u, COL.pink, 3, { dash: [8, 7] }); pill(c, 'dein Winkel', xc + 70, ya - 1.7 * u, COL.pink); say(ok ? 'ok' : 'you', ok ? 'Deine Linie liegt auf der Kapselachse: passt.' : 'Deine Linie (gestrichelt) liegt nicht auf der Kapselachse.'); }
      else say('', 'Lies an der Winkelskala ab, wohin die Kapselachse zeigt.');
    } else {
      if (sv != null) { const xs = x0 + (ok ? 5.3 : clamp(sv, 0, 8)) * u; seg(c, xs, ya - 60, xs, ya + 70, COL.pink, 3, { dash: [8, 7] }); arrow(c, x0, ya + 70, xs, ya + 70, COL.pink, { w: 3 }); pill(c, 'dein Radius', (x0 + xs) / 2, ya + 92, COL.pink); say(ok ? 'ok' : 'you', ok ? 'Deine Marke liegt in der Kapselmitte: passt.' : 'Deine Marke (gestrichelt) liegt nicht in der Kapselmitte.'); }
      else say('', 'Zähle die Kästchen von der Drehachse bis zur Kapselmitte (gelber Punkt).');
    }
  };
  return { onTry(v, hit) { sv = v; ok = hit; }, onDone() { if (!ok) { sv = cfg.which === 'a' ? 37 : 5.3; ok = true; } } };
};

/* Startbild: Newtons Kanone schießt immer schneller, bis die Kugel die Erde umrundet */
function heroScene(host, ctxLike) {
  const st = new Stage(ctxLike, { host, w: 720, h: 400, seed: 5, label: 'Newtons Kanone: Die Kugel fliegt immer weiter, bis sie die Erde umrundet' }), cx = 360, cy = 215, R = 84, r0 = 1.3, ks = [0.55, 0.72, 0.85, 0.94, 1], old = [], tr = new Trail(120);
  const cap = el('div', { class: 'sc-cap' }); host.append(cap); let i = 0, f = Math.PI / 2, wt = 0, loops = 0;
  const mk = k => { if (k >= 1) return q => r0; const rp = r0 * k * k / (2 - k * k), e = (r0 - rp) / (r0 + rp), p = r0 * (1 - e); return q => p / (1 - e * Math.sin(q)); };
  st.draw = (c, dt) => {
    st.stars(); earth(c, cx, cy, R, st.t * 0.05);
    c.save(); c.fillStyle = '#55618a'; c.beginPath(); c.moveTo(cx - 18, cy - R * 0.985); c.lineTo(cx, cy - R * r0 + 3); c.lineTo(cx + 18, cy - R * 0.985); c.closePath(); c.fill(); c.fillStyle = COL.ink; rr(c, cx - 8, cy - R * r0 - 4, 22, 7, 3); c.fill(); c.restore();
    old.forEach(pts => gl(c, COL.amber, 2, c => pts.forEach((p, j) => j ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])), { a: 0.35, glow: false }));
    const k = ks[i], rf = mk(k), rc = rf(f);
    if (k < 1 && rc <= 1.004 && f < Math.PI / 2 - 0.01) { if (wt === 0) { st.spark(cx + R * Math.cos(f), cy - R * Math.sin(f), COL.coral); old.push(tr.p.slice()); } wt += dt; if (wt > 0.7) { i++; f = Math.PI / 2; wt = 0; tr.clear(); } }
    else { f -= k * r0 / (rc * rc) * 1.5 * dt; if (k >= 1 && f < Math.PI / 2 - TAU * 2) { i = 0; f = Math.PI / 2; old.length = 0; tr.clear(); } }
    if (wt === 0) { const r2 = rf(f), bx = cx + R * r2 * Math.cos(f), by = cy - R * r2 * Math.sin(f); tr.push(bx, by); tr.draw(c, COL.amber, 8); ball(c, bx, by, 8, COL.amber); }
    const s = `Abschuss mit ${dn(k * 8, 1)} km/s` + (k >= 1 ? ': Die Kugel fällt um die Erde herum.' : ''); if (cap.textContent !== s) cap.textContent = s;
  };
}

/* Gruppe: eine Situation mit gemeinsamem Bild und mehreren Folien */
const G = (t, info, sc, steps) => ({ t, info, sc, steps });
function station(block, title, sub, groups) {
  const si = ++_sid, steps = [];
  groups.forEach(g => g.steps.forEach(s => steps.push(Object.assign({ id: 's' + si + '_' + (steps.length + 1), info: tex(g.info), infoT: g.t, scene: s.sc || g.sc }, s.def))));
  return { block, title, sub, steps };
}

    n('Schreibe um.', '0,000 000 000 07', 7e-11, '', 'Zähle, um wie viele Stellen das Komma wandert.', '$7·10^-11$ – das ist der Zahlenwert der Gravitationskonstante $G$.', Object.assign({ sc: Z({ s: 7, sl: '7', ops: [{ f: 1e-11, l: 'Komma 11 Stellen nach links' }] }) }, SCI)),
    n('Gib 6400 km in Metern an.', '6400 km', 6.4e6, 'm', '$1 km = 10^3 m$', '$6 400 000 m = 6,4·10^6 m$ (Erdradius)', Object.assign({ sc: Z({ s: 6400, sl: '6400', ops: [{ f: 1e3, l: 'km → m: ·10^3' }] }) }, SCI)),
    n('Gib 100 000 t in Kilogramm an.', '100 000 t', 1e8, 'kg', '$1 t = 10^3 kg$', '$10^5 t = 10^8 kg$', Object.assign({ sc: Z({ s: 1e5, sl: '10^5', ops: [{ f: 1e3, l: 't → kg: ·10^3' }] }) }, SCI, { ph: '10^…' }))]),
  G('Zwei Sumoringer', 'Zwei Sumoringer mit je $m = 100 kg$ stehen sich gegenüber; ihre Schwerpunkte sind 1 m voneinander entfernt. Es gilt $F_G = G·{m_1·m_2|r^2}$ mit $G = 7·10^-11$ m³/(kg·s²).', SC.grav({ style: 'sumo', msg: 'Zwei Massen ziehen sich immer gegenseitig an.' }), [
    n('Berechne die Gravitationskraft zwischen den beiden.', '$F_G$', 7e-7, 'N', '$100·100 = 10^4$', '$F_G = 7·10^-11 · 10^4 N = 7·10^-7 N$', SCI),
    n('Die Gewichtskraft eines Ringers (1000 N) ist rund …-mal so groß. Gib die Größenordnung als Zehnerpotenz an.', 'Faktor', 1e9, '', 'Teile $10^3$ durch $7·10^-7$ und runde großzügig.', '$10^3 : 10^-6 = 10^9$ – rund eine Milliarde Mal.', { pow: true, lo: 1e9, hi: 1.5e9, ph: '10^…' }),
    c('Warum bemerkt man die gegenseitige Anziehung von Menschen nicht?', ['$G$ ist winzig: Andere Kräfte wie die Haftreibung sind viel größer.', 'Menschen ziehen sich nicht an, nur Planeten.', 'Die beiden Kräfte heben sich auf.'], 'Vergleiche mit deinem Ergebnis von eben.', 'Die Anziehung ist da, aber eine Milliarde Mal kleiner als die Gewichtskraft.')])]),

station(3, 'Supertanker und Je-desto', 'Die Proportionalitäten im Gravitationsgesetz', [
  G('Supertanker im Hafen', 'Zwei Supertanker mit je 100 000 t ($10^8 kg$) liegen nebeneinander; ihre Schwerpunkte sind 100 m voneinander entfernt. $G = 7·10^-11$ m³/(kg·s²).', SC.grav({ style: 'tanker', msg: 'Auch Schiffe ziehen sich gegenseitig an.' }), [
    n('Berechne die Gravitationskraft zwischen den Tankern.', '$F_G$', 70, 'N', '$10^8·10^8 = 10^16$ und $(10^2)^2 = 10^4$', '$F_G = 7·10^-11 · 10^12 N = 70 N$'),
    n('Gib an, welcher Masse diese Kraft als Gewichtskraft auf der Erde entspricht.', '$m$', 7, 'kg', '$F = m·g$ mit $g = 10 m/s²$', '70 N : 10 m/s² = 7 kg – etwa ein gefüllter Wasserkasten.'),
    n('Berechne die Beschleunigung, die ein Tanker dadurch erfährt.', '$a$', 7e-7, 'm/s²', '$a = {F|m}$', '$a = {70|10^8} m/s² = 7·10^-7 m/s²$. Wind und Strömung überwiegen bei Weitem – die Tanker stoßen nicht zusammen.', SCI)]),
  G('Je-desto', 'Zwei Kugeln im Abstand $r$ ziehen sich mit der Kraft $F$ an. Ermittle die neue Kraft als Vielfaches von $F$. Brüche gibst du so ein: 1/4.', null, [
    n('Der Abstand $r$ wird verdoppelt.', '$F_{neu} : F$', 0.25, '', '$r$ steht im Nenner im Quadrat.', '$(2r)^2 = 4r^2$, also ein Viertel von $F$.', { frac: true, sc: SC.grav({ scen: { m1: 1, m2: 1, r: 2 } }) }),
    n('Der Abstand $r$ wird halbiert.', '$F_{neu} : F$', 4, '', '$({1|2})^2 = {1|4}$ steht im Nenner.', 'Das Vierfache von $F$.', { frac: true, sc: SC.grav({ scen: { m1: 1, m2: 1, r: 0.5 } }) }),
    n('Der Abstand $r$ wird verdreifacht.', '$F_{neu} : F$', 1 / 9, '', '$3^2$ im Nenner', 'Ein Neuntel von $F$.', { frac: true, show: '1/9', sc: SC.grav({ scen: { m1: 1, m2: 1, r: 3 } }) }),
    n('Die Masse $m_1$ wird verdoppelt.', '$F_{neu} : F$', 2, '', '$m_1$ steht im Zähler.', 'Das Doppelte von $F$.', { frac: true, sc: SC.grav({ scen: { m1: 2, m2: 1, r: 1 } }) }),
    n('$m_1$, $m_2$ und $r$ werden verdoppelt.', '$F_{neu} : F$', 1, '', 'Zähler: $2·2$. Nenner: $2^2$.', '$(2·2) : 2^2 = 1$ – die Kraft bleibt gleich.', { frac: true, sc: SC.grav({ scen: { m1: 2, m2: 2, r: 2 } }) }),
    c('Fasse zusammen.', ['$F ~ m_1·m_2$ und $F ~ {1|r^2}$', '$F ~ m_1·m_2$ und $F ~ {1|r}$', '$F ~ m_1 + m_2$ und $F ~ {1|r^2}$'], 'Sieh dir deine Ergebnisse der letzten Folien an.', 'Doppelte Masse: doppelte Kraft. Doppelter Abstand: ein Viertel der Kraft.', { sc: SC.grav({ scen: { m1: 2, m2: 1, r: 2 }, nobars: true, msg: 'Die Massen stehen im Zähler, der Abstand im Quadrat im Nenner.' }) })])]),

station(3, 'Woher kommt g?', 'Fallbeschleunigung und Abstand von der Erde', [
  G('Woher kommt g = 10 m/s²?', 'Die Erde hat die Masse $M = 6·10^24 kg$ und den Radius $R = 6,4·10^6 m$. Rechne mit $R^2 ≈ 4·10^13 m²$ und $G·M ≈ 4·10^14$ m³/s².', SC.fall({ cols: [{ a: 1, label: 'Feder', kind: 'feder' }, { a: 1, label: 'Hammer', kind: 'hammer' }], msg: 'Fallversuch ohne Luft' }), [
    c('Leite aus $m·g = G·{M·m|R^2}$ eine Formel für $g$ her.', ['$g = {G·M|R^2}$', '$g = {G·M·m|R^2}$', '$g = {G·M|R}$'], 'Teile beide Seiten durch $m$.', '$m$ kürzt sich heraus.'),
    n('Berechne $g$.', '$g$', 10, 'm/s²', '$4·10^14 : (4·10^13)$', '$g = 10^1 m/s² = 10 m/s²$'),
    c('Ohne Luftwiderstand fallen alle Körper gleich schnell, weil …', ['$g$ nicht von der Masse $m$ des fallenden Körpers abhängt.', 'schwere Körper stärker angezogen werden.', 'die Erde alle Körper mit derselben Kraft anzieht.'], 'Kommt $m$ in der Formel für $g$ vor?', '$g$ hängt nur von $M$ und $R$ ab.')]),
  G('Weit weg von der Erde', 'Ein Astronaut hat auf der Erdoberfläche die Gewichtskraft 800 N. Der Erdradius ist $R = 6400 km$.', null, [
    n('Ermittle seine Gewichtskraft in 6400 km Höhe über der Erdoberfläche.', '$F_G$', 200, 'N', 'Die Höhe zählt ab der Oberfläche. Wie groß ist der Abstand vom Erdmittelpunkt?', 'Abstand $2R$: ein Viertel von 800 N, also 200 N.', { sc: SC.abstand({ rf: 2, refl: 'an der Erdoberfläche: 800 N' }) }),
    n('Ermittle seine Gewichtskraft in 12 800 km Höhe.', '$F_G$', 90, 'N', 'Abstand vom Erdmittelpunkt: $R + 2R$', 'Abstand $3R$: ein Neuntel von 800 N, also rund 90 N.', { lo: 85, hi: 92, sc: SC.abstand({ rf: 3, refl: 'an der Erdoberfläche: 800 N' }) })]),
  G('Schwerelos auf der ISS?', 'Auf der ISS (400 km Höhe) beträgt $g$ noch etwa 9 m/s².', SC.kanone({ name: 'Die ISS', slider: { val: 100, label: 'Geschwindigkeit' } }), [
    c('Warum schweben die Astronauten dort trotzdem?', ['ISS und Astronauten fallen gemeinsam um die Erde – keine Unterlage drückt.', 'In 400 km Höhe gibt es keine Gravitation mehr.', 'Eine Fliehkraft hebt die Gravitation auf.'], 'Verändere in der Animation die Geschwindigkeit. Was passiert, wenn die ISS langsamer wird?', 'Die Gravitationskraft wirkt weiter: Sie ist die Zentripetalkraft für die Kreisbahn (freier Fall).')])]),

station(3, 'Mond und Kürbis', 'Andere Himmelskörper, Wechselwirkung', [
  G('Auf dem Mond', 'Der Mond hat die Masse $7·10^22 kg$; sein Radius zum Quadrat ist $R_M^2 ≈ 3·10^12 m²$. Es gilt $g_M = {G·M|R_M^2}$ mit $G = 7·10^-11$ m³/(kg·s²).', SC.fall({ slow: 1.6, cols: [{ a: 10, label: 'Erde', sub: 'g = 10 m/s²', ground: 'erde' }, { a: 1.6, label: 'Mond', sub: 'gesucht', ground: 'mond', col: COL.ink }], msg: 'Fallversuch auf der Erde und auf dem Mond' }), [
    n('Berechne die Fallbeschleunigung auf dem Mond.', '$g_M$', 1.6, 'm/s²', 'Zähler: $7·7 = 49$, also $4,9·10^12$', '$g_M = {4,9·10^12|3·10^12} m/s² ≈ 1,6 m/s²$', { lo: 1.55, hi: 1.7 }),
    n('Vergleiche: $g$ ist etwa …-mal so groß wie $g_M$.', '$g : g_M$', 6, '', '10 : 1,6', '$g_M$ ist etwa ein Sechstel von $g$.', { lo: 5.8, hi: 6.5 }),
    n('Berechne die Gewichtskraft eines Astronauten mit Anzug ($m = 100 kg$) auf dem Mond.', '$F_G$', 160, 'N', '$F = m·g_M$', '$100 kg · 1,6 m/s² = 160 N$ (auf der Erde 1000 N)', { lo: 155, hi: 170 })]),
  G('Wer fällt auf wen?', 'Ein Kürbis ($m = 6 kg$) fällt vom Tisch. Die Erde ($M = 6·10^24 kg$) zieht ihn mit 60 N an.', SC.grav({ msg: 'Die Erde zieht den Kürbis an. Und umgekehrt?', msgDone: 'Beide Kräfte sind gleich groß (Wechselwirkungsprinzip).' }), [
    n('Gib an, mit welcher Kraft der Kürbis die Erde anzieht.', '$F$', 60, 'N', 'Im Gravitationsgesetz sind $m_1$ und $m_2$ gleichberechtigt.', 'Ebenfalls 60 N (Wechselwirkungsprinzip).'),
    n('Berechne die Beschleunigung des Kürbisses.', '$a$', 10, 'm/s²', '$a = {F|m}$', '$60 N : 6 kg = 10 m/s²$'),
    n('Berechne die Beschleunigung der Erde.', '$a_{Erde}$', 1e-23, 'm/s²', '$60 : (6·10^24)$', '$10·10^-24 m/s² = 10^-23 m/s²$ – unmessbar klein. Deshalb sehen wir nur den Kürbis fallen.', Object.assign({}, SCI, { ph: '10^…' }))])]),

station(3, 'Satellit über der Erde', 'Gewichtskraft als Zentripetalkraft', [
  G('Satellit knapp über der Erde', 'Ein Satellit umkreist die Erde knapp über der Oberfläche: $r ≈ R = 6,4·10^6 m$, dort $g = 10 m/s²$. Ansatz: $m·g = {m·v^2|R}$, also $v^2 = g·R$. Rechne mit $π ≈ 3$.', SC.kanone({ test: { vc: 8 } }), [
    c('Begründe den Ansatz.', ['Die Gewichtskraft ist die einzige Kraft und wirkt als Zentripetalkraft.', 'Gewichtskraft und Fliehkraft heben sich auf.', 'Der Satellit ist schwerelos, auf ihn wirkt keine Kraft.'], 'Welche Kraft zwingt den Satelliten auf die Kreisbahn?', '$m·g$ ist die Zentripetalkraft; $m$ kürzt sich heraus.', { sc: SC.kanone({ slider: { val: 100 } }) }),
    n('Berechne die Bahngeschwindigkeit in km/s.', '$v$', 8, 'km/s', '$v^2 = 10 · 6,4·10^6 m²/s² = 64·10^6 m²/s²$', '$v = 8·10^3 m/s = 8 km/s$'),
    n('Berechne die Umlaufdauer in Minuten.', '$T$', 80, 'min', '$T = {2π·R|v}$ in Sekunden, dann durch 60 teilen', '$T = {6 · 6,4·10^6|8·10^3} s = 4800 s = 80 min$', { lo: 78, hi: 85, sc: SC.bahnen({ orb: [{ rr: 0.55, w: 1.1, name: 'Satellit' }], gi: 0, ghost: 'T', note: 'Zeitraffer' }) }),
    c('Muss ein schwererer Satellit schneller fliegen?', NO_M, 'Kommt $m$ in $v^2 = g·R$ vor?', '$v$ hängt nur von $g$ und $R$ ab.', { sc: SC.bahnen({ orb: [{ rr: 0.55, w: 1.1, name: 'Satellit' }], showF: true, note: 'Zeitraffer', msg: 'Die Gewichtskraft hält den Satelliten auf der Bahn.' }) })])]),

/* ---------------- Block V: Satellitenbahnen (G = 6·10^-11) ---------------- */
station(4, 'Formeln umstellen', 'Das Handwerkszeug für die Bahnen', [
  G('Formeln umstellen', 'Stelle die Formel nach der angegebenen Größe um.', K({ Td: 4, showV: true, showF: true, msg: 'Blauer Pfeil: Geschwindigkeit. Grüner Pfeil: Zentripetalkraft.' }), [
    c('$v = {2π·r|T}$ nach $T$', ['$T = {2π·r|v}$', '$T = {v|2π·r}$', '$T = 2π·r·v$'], 'Multipliziere mit $T$, teile dann durch $v$.', '$T = {2π·r|v}$', { sc: K({ Td: 4, showV: true, ghost: 'T', rat: [1, 3, 0.3] }) }),
    c('$F_Z = {m·v^2|r}$ nach $v$', ['$v = √{F_Z·r|m}$', '$v = {F_Z·r|m}$', '$v = √{F_Z·m|r}$'], 'Erst nach $v^2$ auflösen, dann die Wurzel ziehen.', '$v^2 = {F_Z·r|m}$', { sc: K({ Td: 4, showV: true, showF: true, ghost: 'v', rat: [1, 2.6, 0.4] }) }),
    c('$F_G = G·{m·M|r^2}$ nach $r$', ['$r = √{G·m·M|F_G}$', '$r = {G·m·M|F_G}$', '$r = √{F_G|G·m·M}$'], 'Erst nach $r^2$ auflösen, dann die Wurzel ziehen.', '$r^2 = {G·m·M|F_G}$', { sc: SC.bahnen({ orb: [{ rr: 0.6, w: 1, name: 'Satellit' }], showF: true, note: 'Roter Pfeil: Gravitationskraft', msg: 'Die Gravitationskraft hängt vom Abstand ab.' }) })]),
  G('Gravitationskraft als Zentripetalkraft', 'Auf der Kreisbahn wirkt die Gravitationskraft als Zentripetalkraft: $F_G = F_Z$.', SC.bahnen({ orb: [{ rr: 0.6, w: 1, name: 'Satellit' }], gi: 0, ghost: 'v', rat: [1, 2.4, 3, 0.4], showF: true, note: 'Roter Pfeil: Gravitationskraft' }), [
    c('Setze $F_G = F_Z$ und löse nach $v$ auf.', ['$v = √{G·M|r}$', '$v = √{G·m·M|r}$', '$v = {G·M|r}$', '$v = √{G·M|r^2}$'], '$G·{m·M|r^2} = {m·v^2|r}$: mit $r$ multiplizieren, durch $m$ teilen.', '$v^2 = {G·M|r}$ – die Masse $m$ des Satelliten kürzt sich heraus.'),
    c('Setze die Gewichtskraft $F_g = m·g$ gleich $F_G$ und löse nach $g$ auf.', ['$g = {G·M|r^2}$', '$g = {G·m·M|r^2}$', '$g = {G·M|r}$'], 'Teile beide Seiten durch $m$.', '$m·g = G·{m·M|r^2}$, also $g = {G·M|r^2}$.', { sc: SC.bahnen({ orb: [{ rr: 0.6, w: 1, name: 'Satellit' }], showF: true, note: 'Roter Pfeil: Gravitationskraft', msg: 'Gewichtskraft und Gravitationskraft sind dieselbe Kraft.' }) })])]),

station(4, 'Newtons Kanone', 'Das Gedankenexperiment', [
  G('Newtons Kanone', 'Newtons Gedankenexperiment: Auf einem sehr hohen Berg steht eine Kanone, die Kugeln waagrecht abschießt – mit jedem Schuss schneller. Den Luftwiderstand lassen wir weg.', kanSl(42), [
    c('Wird die Kugel schneller abgeschossen, dann …', ['fliegt sie weiter, bevor sie aufschlägt.', 'schlägt sie näher am Berg auf.', 'ändert sich ihre Bahn nicht.'], 'Probiere es mit dem Regler aus.', 'Die Erde ist gekrümmt: Der Boden „fällt“ unter der Kugel weg.'),
    c('Bei einer bestimmten Geschwindigkeit …', ['umrundet die Kugel die Erde auf einer Kreisbahn.', 'bleibt die Kugel in der Luft stehen.', 'fliegt die Kugel geradeaus ins All.'], 'Erhöhe die Geschwindigkeit bis etwa 8 km/s.', 'Sie kommt von hinten zur Kanone zurück.', { sc: kanSl(70) }),
    c('Warum schlägt die Kugel auf der Kreisbahn nie auf?', ['Sie fällt genauso stark, wie sich die Erdoberfläche wegkrümmt.', 'So weit oben wirkt keine Gravitation mehr.', 'Eine Fliehkraft trägt sie.'], 'Die Kugel fällt die ganze Zeit. Was macht währenddessen der Boden unter ihr?', 'Die Kugel „fällt um die Erde herum“.', { sc: kanSl(100) }),
    c('Nenne die Kraft, die die Kugel auf der Kreisbahn hält.', ['die Gravitationskraft der Erde', 'die Kraft der Kanone', 'den Luftwiderstand', 'eine Fliehkraft'], 'Es wirkt nur eine einzige Kraft.', 'Die Gravitationskraft wirkt als Zentripetalkraft.', { sc: kanSl(100) }),
    c('Wird die Kugel noch schneller abgeschossen, dann …', ['läuft sie auf einer Ellipse.', 'läuft sie auf einem engeren Kreis.', 'fällt sie zur Erde zurück.'], 'Schiebe den Regler über 8 km/s.', 'Ellipsenbahn; bei sehr hoher Geschwindigkeit verlässt die Kugel die Erde.', { sc: kanSl(100) })])]),

station(4, 'Das Gravitationsgesetz unter der Lupe', 'Einsetzen und vergleichen', [
  G('Astronaut', 'Ein Astronaut mit Raumanzug hat die Masse $m = 100 kg$. Es gilt $F_G = G·{m·M_E|r^2}$ mit $G = 6·10^-11$ m³/(kg·s²), $M_E = 6·10^24 kg$ und $R_E = 6·10^6 m$. Zum Vergleich: $G·m·M_E = 3,6·10^16$ und $R_E^2 = 3,6·10^13$.', SC.abstand({ rf: 1 }), [
    n('Berechne die Gravitationskraft der Erde auf ihn an der Erdoberfläche.', '$F_G$', 1000, 'N', '$3,6·10^16 : (3,6·10^13)$', '$F_G = 10^3 N = 1000 N$'),
    n('Berechne seine Gewichtskraft mit $g = 10 m/s²$.', '$F_g$', 1000, 'N', '$F_g = m·g$', '$100 kg · 10 m/s² = 1000 N$'),
    c('Vergleiche die beiden Ergebnisse.', ['Gleich groß: Die Gewichtskraft ist die Gravitationskraft der Erde.', 'Die Gravitationskraft ist größer.', 'Die Gewichtskraft ist größer.'], 'Sieh dir deine beiden Zahlen an.', '$m·g$ ist nur eine andere Schreibweise für $G·{m·M_E|R_E^2}$.'),
    n('Berechne die Kraft im doppelten Abstand vom Erdmittelpunkt ($r = 1,2·10^7 m$, also $r^2 = 1,44·10^14 m²$).', '$F_G$', 250, 'N', '$3,6·10^16 : (1,44·10^14)$', '$0,25·10^3 N = 250 N$. Doppelter Abstand: ein Viertel der Kraft ($F ~ 1/r^2$).', { sc: SC.abstand({ rf: 2, refl: '100 kg an der Erdoberfläche: 1000 N' }) }),
    n('Berechne die Kraft, wenn er mit voller Ausrüstung ($m = 200 kg$) auf der Erdoberfläche steht.', '$F_G$', 2000, 'N', 'Im Zähler verdoppelt sich nur $m$.', '$2 · 1000 N = 2000 N$. Doppelte Masse: doppelte Kraft ($F ~ m$).', { sc: SC.abstand({ rf: 1, mf: 2, refl: '100 kg an der Erdoberfläche: 1000 N' }) }),
    n('Gib ohne Rechnung die Kraft auf den 100-kg-Astronauten im dreifachen Abstand an.', '$F_G$', 110, 'N', '$3^2$ im Nenner', 'Ein Neuntel von 1000 N, also rund 110 N.', { lo: 105, hi: 115, sc: SC.abstand({ rf: 3, refl: '100 kg an der Erdoberfläche: 1000 N' }) })])]),

station(4, 'Die Kanone in Zahlen', 'Geschwindigkeit und Umlaufdauer', [
  G('Newtons Kanone in Zahlen', 'Den Berg vernachlässigen wir: Die Kugel kreist knapp über dem Boden, $r = R_E = 6·10^6 m$. Es gilt $v^2 = {G·M_E|r}$ mit $G·M_E = 3,6·10^14$ m³/s². Runde $v^2$ auf eine Quadratzahl und rechne mit $π ≈ 3$.', SC.kanone({ test: { vc: 8000 } }), [
    n('Berechne die Geschwindigkeit der Kugel in m/s.', '$v$', 8000, 'm/s', '$v^2 = 6·10^7 m²/s² ≈ 64·10^6 m²/s²$', '$v ≈ 8·10^3 m/s$'),
    n('Gib die Geschwindigkeit in km/s an.', '$v$', 8, 'km/s', '1 km = 1000 m', '8000 m/s = 8 km/s', { sc: SC.kanone({ test: { vc: 8 } }) }),
    n('Berechne die Umlaufdauer in Sekunden. Der Umfang ist $2π·r ≈ 3,6·10^7 m$.', '$T$', 4500, 's', '$T = {2π·r|v} = {36·10^6|8·10^3} s$', '$T = 4,5·10^3 s = 4500 s$', { lo: 4400, hi: 4800, sc: SC.bahnen({ orb: [{ rr: 0.5, w: 1.1, name: 'Kugel knapp über der Erde' }], gi: 0, ghost: 'T', note: 'Zeitraffer' }) }),
    n('Gib die Umlaufdauer in Minuten an.', '$T$', 75, 'min', 'Teile 4500 s durch 60.', '4500 s : 60 = 75 min', { lo: 73, hi: 80, sc: SC.bahnen({ orb: [{ rr: 0.5, w: 1.1, name: 'Kugel knapp über der Erde' }], gi: 0, ghost: 'T', note: 'Zeitraffer' }) })]),
  G('Die Raumstation ISS', 'Die ISS umrundet die Erde in etwa 90 min. Ein Tag hat 1440 min.', SC.tagnacht(), [
    n('Berechne, wie viele Erdumrundungen die ISS an einem Tag schafft.', 'Anzahl', 16, '', '1440 : 90', '1440 min : 90 min = 16'),
    n('Gib an, wie oft die Besatzung an einem Tag die Sonne aufgehen sieht.', 'Anzahl', 16, '', 'Was passiert bei jeder Umrundung genau einmal?', 'Bei jeder Umrundung fliegt die ISS einmal von der Nachtseite auf die Tagseite.')])]),

station(4, 'Weiter draußen', 'Vom erdnahen Satelliten bis zum Mond', [
  G('Weiter draußen', 'Die Formel $v^2 = {G·M_E|r}$ gilt für jeden Satelliten im Abstand $r$ vom Erdmittelpunkt. Hier: $r = 3,6·10^8 m$ und $G·M_E = 3,6·10^14$ m³/s².', SC.bahnen({ orb: [{ rr: 0.3, w: 1.6, name: 'knapp über der Erde: 8 km/s' }, { rr: 0.92, w: 0.2, name: 'r = 3,6·10^8 m' }], gi: 1, hi: 1, ghost: 'v' }), [
    n('Berechne die Geschwindigkeit dieses Satelliten in km/s.', '$v$', 1, 'km/s', '$v^2 = {3,6·10^14|3,6·10^8} m²/s²$', '$v^2 = 10^6 m²/s²$, also $v = 10^3 m/s = 1 km/s$'),

/* ===== App: Zustand, Ablauf, Auswertung ===== */
/* Prüfansicht: true = alle Folien offen, Weiter ohne Lösen. Für die Schüler auf false setzen. */
const OPEN = false;
const KEY = 'kreis-gravitation-lernpfad-v2' + (OPEN ? '-pruefansicht' : '');
const $ = (s, r = document) => r.querySelector(s);
const TICK = new Set();
let S = null, cur = null, lastT = 0;
const DOT = '<svg viewBox="0 0 18 26" aria-hidden="true"><circle class="cp" cx="9" cy="9" r="6"/></svg>';

function fresh() { return { v: 1, names: [], secs: 0, st: 0, sp: 0, view: 'start', res: {}, open: 0, free: OPEN, runs: {}, date: null }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ohne Speicher geht es auch */ } }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === 1 && s.res) return s; } catch (e) { /* kein Speicher */ } return null; }
function clock(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function stScore(si) { let p = 0, m = 0, n = 0; for (const s of COURSE[si].steps) { m += s.pts; const r = S.res[s.id]; if (r) { p += r.p; n++; } } return { p, m, n, all: n === COURSE[si].steps.length }; }
function total() { let p = 0, m = 0; COURSE.forEach((c, i) => { const s = stScore(i); p += s.p; m += s.m; }); return { p, m }; }
function started() { return Object.keys(S.res).length > 0 || S.st > 0 || S.sp > 0; }

function frame(ts) {
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts;
  for (const o of TICK) { try { o.tick(dt); } catch (e) { console.error(e); TICK.delete(o); } }
  requestAnimationFrame(frame);
}
function teardown() {
  if (!cur) return;
  cur.timers.forEach(clearTimeout);
  for (const o of cur.objs) { TICK.delete(o); if (o.destroy) o.destroy(); }
  cur = null;
}
/* kleine Funken an einer Stelle des Bildschirms */
function burst(target, n = 14) {
  if (REDUCED || !target || !target.getBoundingClientRect) return;
  const r = target.getBoundingClientRect(); if (!r.width) return;
  const box = el('div', { class: 'burst', 'aria-hidden': 'true', style: `left:${(r.left + r.width / 2).toFixed(0)}px;top:${(r.top + r.height / 2).toFixed(0)}px` });
  const cols = ['#ffc52e', '#1f9d63', '#1d57d6', '#ff8a80'];
  for (let i = 0; i < n; i++) { const w = 2 * Math.PI * i / n + Math.random() * 0.5, d = 30 + Math.random() * 46; box.append(el('i', { style: `--dx:${(Math.cos(w) * d).toFixed(0)}px;--dy:${(Math.sin(w) * d).toFixed(0)}px;--c:${cols[i % 4]};animation-delay:${(Math.random() * 90).toFixed(0)}ms` })); }
  document.body.append(box); setTimeout(() => box.remove(), 1300);
}
function confetti() {
  if (REDUCED) return;
  const box = el('div', { class: 'confetti', 'aria-hidden': 'true' }), cols = ['#ffc52e', '#1f9d63', '#1d57d6', '#ff8a80', '#7fb0ff'];
  for (let i = 0; i < 70; i++) box.append(el('i', { style: `left:${(Math.random() * 100).toFixed(1)}%;--c:${cols[i % 5]};--t:${(2.4 + Math.random() * 1.8).toFixed(2)}s;--d:${(Math.random() * 0.9).toFixed(2)}s;--dx:${(Math.random() * 120 - 60).toFixed(0)}px;--r:${(360 + Math.random() * 540).toFixed(0)}deg` }));
  document.body.append(box); setTimeout(() => box.remove(), 5600);
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 3200); }

function renderTop() {
  const chain = $('#chain'); chain.innerHTML = '';
  COURSE.forEach((c, i) => {
    const sc = stScore(i), open = true;
    const b = el('button', { type: 'button', class: (sc.all ? 'is-done ' : '') + (S.view === 'step' && S.st === i ? 'is-cur ' : '') + (i > 0 && c.block !== COURSE[i - 1].block ? 'blk-start' : ''), title: `${i + 1} ${c.title}`, 'aria-label': `Station ${i + 1}: ${c.title}` + (sc.all && sc.m ? `, ${sc.p} von ${sc.m} Punkten` : ''), html: DOT });

    b.addEventListener('click', () => gotoStation(i));
    chain.append(b);
  });
  $('#pts').textContent = total().p; $('#time').textContent = clock(S.secs);
}
function gotoStation(i) { if (!S.date) S.date = new Date().toISOString(); const k = S.free ? 0 : COURSE[i].steps.findIndex(s => !S.res[s.id]); showStep(i, k < 0 ? 0 : k); }

    el('p', { class: 'note', text: 'Wertung: volle Punktzahl beim ersten Versuch, die halbe beim zweiten. In der Auswertung lässt sich jede Station noch einmal bearbeiten – die volle Punktzahl ist also für jeden erreichbar. Der Fortschritt bleibt auf diesem Gerät gespeichert.' }), el('div', { class: 'startbtns' }, go, pick)));

    el('div', {}, el('div', { class: 'eyebrow', text: 'Physik 11 · Lernpfad mit allen Aufgabenblättern' }), el('h1', { html: 'Kreisbewegung <span>&amp; Gravitation</span>' }),
      el('p', { class: 'lead', text: 'Warum fliegt ein Stein geradeaus weiter, wenn die Schnur reißt? Und warum fällt ein Satellit nicht herunter? Vom Kinderkarussell bis zur Mondbahn – mit Zahlen, die sich im Kopf rechnen lassen.' }),
      el('div', { class: 'facts' }, el('span', { text: `${COURSE.length} Stationen` }), el('span', { text: `${COURSE.reduce((a, c) => a + c.steps.length, 0)} Folien` }), el('span', { text: `${t.m} Punkte` }))), hero);
  right.append(roadmap());
  main.append(el('div', { class: 'start' }, left, right));

}
/* Wegweiser: die sieben Blöcke mit je einem kleinen Bild */
function roadmap() {

  const tiles = [

    ['II', `<path d="M14 62C40 62 44 14 106 14" fill="none" stroke="#273763" stroke-width="16" stroke-linecap="round"/><path d="M14 62C40 62 44 14 106 14" fill="none" stroke="${I2}" stroke-width="1.4" stroke-dasharray="6 6"/><rect x="50" y="26" width="20" height="11" rx="3" fill="${A}" transform="rotate(-52 60 31)"/>`],
    ['III', `<text x="60" y="48" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="34" fill="${A}">10<tspan dy="-14" font-size="20">−11</tspan></text>`],
    ['IV', `<circle cx="32" cy="36" r="13" fill="${A}"/><circle cx="92" cy="36" r="9" fill="${A}"/><path d="M50 36h14M79 36H67" stroke="${R}" stroke-width="2.6" stroke-linecap="round"/><path d="M64 36l-5-3.5v7zM67 36l5-3.5v7z" fill="${R}"/>`],
    ['V', `<ellipse cx="60" cy="36" rx="44" ry="22" fill="none" stroke="${I2}" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="60" cy="36" r="13" fill="#2a63de" stroke="${B}" stroke-width="1.2"/><circle cx="98" cy="25" r="4.5" fill="${A}"/>`],
    ['VI', `<path d="M22 12v50M14 62h16M22 20h58" stroke="${I}" stroke-width="3" stroke-linecap="round"/><rect x="74" y="24" width="18" height="32" rx="5" fill="${I}" transform="rotate(-34 80 22)"/>`],
    ['VII', `<circle cx="60" cy="36" r="24" fill="none" stroke="${M}" stroke-width="2.4"/><path d="M48 37l9 9 16-19" fill="none" stroke="${M}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`]];

  tiles.forEach(([no, svg], bi) => { const box = el('button', { type: 'button', 'aria-label': `Block ${no}: ${BLOCKS[bi]}, zur ersten Station`, html: `<svg viewBox="0 0 120 72" aria-hidden="true">${svg}</svg>` }); box.addEventListener('click', () => gotoStation(COURSE.findIndex(c => c.block === bi))); box.append(el('b', { text: 'Block ' + no }), el('span', { text: ['Kreis', 'Alltag', 'Potenzen', 'Gravitation', 'Satelliten', 'Moonraker', 'Test'][bi] })); road.append(box); });
  return road;
}

/* ---------- Eine Folie anzeigen ---------- */
function showStep(si, pi) {
  teardown();
  const st = COURSE[si], step = st.steps[pi];
  S.view = 'step'; S.viewWas = 'step'; S.st = si; S.sp = pi; if (si > S.open) S.open = si; save();
  cur = { timers: [], objs: [] };
  const main = $('#main'); main.innerHTML = ''; window.scrollTo(0, 0);
  const sceneEl = el('div', { class: 'scene' }), ui = el('div', { class: 'ui' });
  const fb = el('div', { class: 'fb', role: 'status', 'aria-live': 'polite' }, el('span', { class: 'fb-i' }), el('div', { class: 'fb-b' })); fb.hidden = true;
  const hintHost = el('div', { class: 'ui' });
  const next = el('button', { class: 'btn', type: 'button', id: 'next', text: pi + 1 < st.steps.length ? 'Weiter' : si + 1 < COURSE.length ? 'Nächste Station' : 'Zur Auswertung' });
  const back = el('button', { class: 'btn plain small', type: 'button', text: 'Zurück' });
  const solveBtn = el('button', { class: 'btn plain small solve', type: 'button', text: 'Lösung zeigen' }); solveBtn.hidden = true;
  const locked = !!S.res[step.id];
  next.disabled = !(locked || S.free);
  const setFb = (kind, html) => { fb.hidden = false; fb.className = 'fb ' + kind; fb.firstChild.textContent = kind === 'ok' ? '✓' : kind === 'no' ? '✗' : kind === 'warn' ? '!' : 'i'; fb.lastChild.innerHTML = html; refit(); };
  let capEl = null, hintBtn = null;
  const ctx = {
    step, max: step.pts, sceneEl, ui, locked, over: false, penalty: 0, scene: null,
    add(o) { cur.objs.push(o); TICK.add(o); return o; },
    later(fn, ms) { const mine = cur, id = setTimeout(() => { if (cur === mine) fn(); }, ms); cur.timers.push(id); return id; },
    cap(html) { if (!capEl) capEl = el('div', { class: 'sc-cap' }); sceneEl.append(capEl); capEl.innerHTML = html; refit(); },
    note(kind, html) { if (!ctx.over) setFb(kind, html); },
    /* nach einem eigenen Versuch lässt sich die Lösung einblenden */
    onSolve(fn) { ctx.solveFn = fn; },
    tried() { if (ctx.over || !ctx.solveFn || locked) return; solveBtn.hidden = false; refit(); },
    clearNote() { if (!ctx.over) fb.hidden = true; },
    hint(html) {
      const box = el('div', { class: 'fb warn' }, el('span', { class: 'fb-i', text: 'i' }), el('div', { html })); box.hidden = true;
      hintBtn = el('button', { class: 'btn plain small', type: 'button', text: locked || !step.pts ? 'Hinweis anzeigen' : 'Hinweis anzeigen (kostet 1 Punkt)', style: 'align-self:flex-start' });
      hintBtn.addEventListener('click', () => { if (!locked) ctx.penalty = 1; box.hidden = false; hintBtn.remove(); hintBtn = null; refit(); });
      hintHost.append(hintBtn, box);
    },
    finish(p, html, kind = 'ok', lead = '') {
      if (ctx.over) return;
      p = clamp(Math.round(p - ctx.penalty), 0, ctx.max);
      let rec = S.res[step.id];
      if (!rec) { rec = S.res[step.id] = { p, m: step.pts }; save(); }
      /* richtig, aber erst im zweiten Anlauf und ohne Punkte: neutral statt grün */
      const k = kind === 'part' ? (p > 0 ? 'ok' : 'no') : (kind === 'ok' && p === 0 && step.pts > 0 && !locked) ? 'info' : kind;
      const label = !step.pts ? 'Ohne Wertung' : locked ? `Bereits gewertet: ${rec.p} von ${rec.m} Punkten` : `${p} von ${step.pts} Punkten` + (ctx.penalty ? ', 1 Punkt für den Hinweis abgezogen' : '');
      setFb(k, `<span class="fb-p">${label}</span>${lead}${html}`);
      ctx.over = true; next.disabled = false; if (hintBtn) hintBtn.remove(); solveBtn.hidden = true;
      if (!locked && p > 0) {
        const ro = $('#readout'); ro.classList.remove('bump'); void ro.offsetWidth; ro.classList.add('bump');
        if (p === step.pts) ctx.later(() => burst(fb.firstChild), 120);
      }
      if (step.done && !ctx.doneRan) { ctx.doneRan = true; step.done(ctx); }
      if (ctx.scene && ctx.scene.onDone && !ctx.sceneDone) { ctx.sceneDone = true; ctx.scene.onDone(); }
      renderTop();
    }
  };
  const task = el('div', { class: 'task' },
    el('div', { class: 'task-meta' }, el('span', { text: `Folie ${pi + 1} von ${st.steps.length}` }), el('span', { text: !step.pts ? 'ohne Wertung' : locked ? `gewertet: ${S.res[step.id].p} von ${step.pts}` : `${step.pts} Punkt${step.pts > 1 ? 'e' : ''}` })),
    step.info ? el('div', { class: 'info' }, el('b', { text: step.infoT || 'Neu' }), el('div', { html: step.info })) : null,
    el('p', { class: 'q', html: T(step.q) }), step.how ? el('p', { class: 'how', html: T(step.how) }) : null, ui, hintHost, fb, el('div', { class: 'nav' }, back, solveBtn, next));
  main.append(
    el('section', { class: 'st-head' },
      el('span', { class: 'st-no', text: String(si + 1).padStart(2, '0') }),
      el('div', { class: 'st-tt' },
        el('div', { class: 'eyebrow', text: `Station ${si + 1} von ${COURSE.length} · ${BLOCKS[st.block]} · ${st.sub}` + ((S.runs[si] || 1) > 1 ? ` · ${S.runs[si]}. Durchgang` : '') }),
        el('h1', { text: st.title }))),
    el('div', { class: 'work' + (step.scene ? '' : ' no-scene') }, step.scene ? sceneEl : null, task));
  solveBtn.addEventListener('click', () => { if (!ctx.over && ctx.solveFn) ctx.solveFn(); });
  back.addEventListener('click', () => { if (pi > 0) showStep(si, pi - 1); else if (si > 0) showStep(si - 1, COURSE[si - 1].steps.length - 1); else { S.viewWas = 'step'; showStart(); } });
  next.addEventListener('click', () => {
    if (pi + 1 < st.steps.length) return showStep(si, pi + 1);
    const sc = stScore(si);
    if (sc.all) toast(`Station ${si + 1} abgeschlossen` + (sc.m ? `: ${sc.p} von ${sc.m} Punkten` : ''));
    if (si + 1 < COURSE.length) showStep(si + 1, 0); else showSum();
  });
  if (step.scene) ctx.scene = step.scene(ctx);
  step.ui(ctx);
  if (locked && step.done && !ctx.doneRan) { ctx.doneRan = true; step.done(ctx); }
